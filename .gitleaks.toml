[extend]
useDefault = true

[[allowlists]]
description = "Aurora render snapshot: local HTTP JWK URL and SHA256 of an empty JSON object, neither is a credential"
condition = "AND"
paths = ['''^test-configs/operator-wandb/__snapshots__/(mysql-aws-iam|snap-oidc-external-config)\.snap$''']
regexTarget = "match"
regexes = [
  '''^GORILLA_AUTH_JWK_URL: "aHR0cDovL2NoYXJ0c25hcC1hcHA6ODA4My9hcGkvandrcy5qc29u"$''',
  '''^secret: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a$''',
]

[[allowlists]]
description = "OIDC unit-test expectations encode the literal fixture value legacy-secret"
condition = "AND"
paths = ['''^charts/operator-wandb/tests/oidc_config_test\.yaml$''']
regexTarget = "match"
regexes = ['''^(OIDC_SECRET|client-secret): bGVnYWN5LXNlY3JldA==$''']
