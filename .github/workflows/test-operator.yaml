name: Test operator Chart

on:
  pull_request:
    paths:
      - charts/operator/**
      - test-configs/operator/**
      - scripts/normalize_snapshot_chart_versions.py
      - snapshots.sh
      - .github/workflows/test-operator.yaml

jobs:
  snapshots:
    name: RBAC and snapshot testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.20.1
      - name: Test operator chart
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.1
          helm unittest ./charts/operator/
          helm plugin install https://github.com/origranot/helm-cascade --version v1.1.1
          helm plugin install https://github.com/jlandowner/helm-chartsnap
          ./snapshots.sh run operator
