name: Lint Charts

on:
  # No paths filter: run on every PR and let ct + ct.yaml gate what's linted.
  pull_request:

env:
  # When upgrading, re-evaluate the repository-owned checks for gaps helmfmt now covers.
  HELMFMT_VERSION: "0.5.0"
  HELMFMT_LINUX_X86_64_SHA256: "17e6de3266b7bfeb50f4e425736d3362c3c7a01bf9756710b1d350f9ced78fb2"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    environment: Helm Charts
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@f382f75448129b3be48f8121b9857be18d815a82 # v3.4
        with:
          version: v3.16.3

      # Python is required because `ct lint` runs Yamale (https://github.com/23andMe/Yamale) and
      # yamllint (https://github.com/adrienverge/yamllint) which require Python
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.10"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: v3.11.0

      - name: Set up helmfmt
        run: |
          archive="${RUNNER_TEMP}/helmfmt.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/digitalstudium/helmfmt/releases/download/v${HELMFMT_VERSION}/helmfmt_Linux_x86_64.tar.gz" \
            --output "${archive}"
          echo "${HELMFMT_LINUX_X86_64_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" helmfmt
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Test template tooling
        run: python3 -m unittest discover -s scripts/tests

      - name: Check Helm template formatting
        run: python3 scripts/format_templates.py --check

      - name: Check template maintainability
        run: python3 scripts/check_template_maintainability.py

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [[ -n "$changed" ]]; then
            echo "::set-output name=changed::true"
          fi

      - name: Run chart-testing  (lint)
        run: ct lint --config ct.yaml
