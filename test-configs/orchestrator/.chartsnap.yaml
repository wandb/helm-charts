# Mask chart-generated random secrets for snapshot stability.
dynamicFields:
  # Helm does not send hooks through post-renderers. Match hook resources by
  # exact name so chartsnap does not create labels on unrelated resources.
  - name: chartsnap-auth-migrate
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - name: chartsnap-authz-apply-schema
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - name: chartsnap-migrate
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Job
    name: chartsnap-auth-migrate
    jsonPath:
      - /spec/template/metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Job
    name: chartsnap-authz-apply-schema
    jsonPath:
      - /spec/template/metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Job
    name: chartsnap-migrate
    jsonPath:
      - /spec/template/metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - apiVersion: v1
    kind: Secret
    name: chartsnap-encryption-key
    jsonPath:
      - /data/AES_256_KEY
  - apiVersion: v1
    kind: Secret
    name: chartsnap-auth-secret
    jsonPath:
      - /data/AUTH_SECRET
