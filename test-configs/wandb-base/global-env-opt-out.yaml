disableGlobalEnv: true

global:
  env:
    GLOBAL_CURRENT: must-not-render
  extraEnv:
    GLOBAL_LEGACY: must-not-render

globalOptOut:
  env: "{{ .Values.disableGlobalEnv }}"

env:
  CHART_LOCAL: retained
extraEnv:
  CHART_LEGACY: retained

containers:
  app:
    image:
      repository: nginx
      tag: "1.27"

initContainers:
  setup:
    image:
      repository: busybox
      tag: "1.36"
    env:
      INIT_LOCAL: retained
