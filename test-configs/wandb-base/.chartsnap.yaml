dynamicFields:
  # Helm does not send hooks through post-renderers. Match the hook resource by
  # exact name so chartsnap does not create labels on unrelated resources.
  - kind: Job
    name: chartsnap-zero-fields
    jsonPath:
      - /metadata/labels/helm.sh~1chart
      - /spec/template/metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
