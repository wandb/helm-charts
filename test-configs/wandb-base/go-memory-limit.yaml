containers:
  api:
    goMemoryLimit: "8GiB"
    image:
      repository: example.invalid/api
      tag: test
  sidecar:
    image:
      repository: example.invalid/sidecar
      tag: test

initContainers:
  migrate-db:
    image:
      repository: example.invalid/migrate
      tag: test

jobs:
  compact:
    containers:
      worker:
        goMemoryLimit: "2GiB"
        image:
          repository: example.invalid/worker
          tag: test

cronJobs:
  cleanup:
    schedule: "0 2 * * *"
    containers:
      worker:
        goMemoryLimit: "3GiB"
        image:
          repository: example.invalid/worker
          tag: test
