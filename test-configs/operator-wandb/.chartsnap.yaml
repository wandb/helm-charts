dynamicFields:
  # Helm does not send hooks through post-renderers. Match hook resources by
  # exact name so chartsnap does not create labels on unrelated resources.
  - name: chartsnap-app-rename-post-hook
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - name: chartsnap-app-rename-pre-hook
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - name: chartsnap-internal-signer-pre-hook
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - name: chartsnap-ch-migrate
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Pod
    name: chartsnap-operator-wandb-test-connection
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Pod
    name: chartsnap-operator-wandb-test-mcp
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Pod
    name: chartsnap-operator-wandb-test-olap-history
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Pod
    name: chartsnap-operator-wandb-test-olap-registry-search
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Pod
    name: chartsnap-operator-wandb-test-olap-run-store-accelerator
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Pod
    name: chartsnap-operator-wandb-test-weave
    jsonPath:
      - /metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Job
    name: chartsnap-app-rename-post-hook
    jsonPath:
      - /spec/template/metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Job
    name: chartsnap-app-rename-pre-hook
    jsonPath:
      - /spec/template/metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Job
    name: chartsnap-internal-signer-pre-hook
    jsonPath:
      - /spec/template/metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - kind: Job
    name: chartsnap-ch-migrate
    jsonPath:
      - /spec/template/metadata/labels/helm.sh~1chart
    value: "###CHART_VERSION###"
  - apiVersion: helm-chartsnap.jlandowner.dev/v1alpha1
    kind: Unknown
    name: helm-output
    jsonPath:
      - /raw
  - apiVersion: v1
    kind: Secret
    name: chartsnap-gorilla-session-key
    jsonPath:
      - /data/GORILLA_SESSION_KEY
  - apiVersion: v1
    kind: Secret
    name: chartsnap-mysql
    jsonPath:
      - /data/MYSQL_ROOT_PASSWORD
      - /data/MYSQL_PASSWORD
  - apiVersion: v1
    kind: Secret
    name: chartsnap-clickhouse
    jsonPath:
      - /data/CLICKHOUSE_PASSWORD
  - apiVersion: v1
    kind: Secret
    name: chartsnap-olap-registry-search
    jsonPath:
      - /data/REGISTRY_SEARCH_PASSWORD
  - apiVersion: v1
    kind: Secret
    name: chartsnap-olap-run-store-accelerator
    jsonPath:
      - /data/RUN_STORE_ACCELERATOR_PASSWORD
  - apiVersion: v1
    kind: Secret
    name: chartsnap-olap-history
    jsonPath:
      - /data/HISTORY_PASSWORD
