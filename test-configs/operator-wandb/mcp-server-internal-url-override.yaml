global:
  host: "https://wandb.example.com"
  size: "large"
  api:
    enabled: true
  weave-trace:
    enabled: false

weave-trace:
  install: false

mcp-server:
  install: true
  performance:
    profile: "local"
  env:
    WANDB_INTERNAL_BASE_URL: "http://custom-wandb-api.platform.svc:8081"
    MCP_WORKLOAD_PROFILE: "shared"
    MCP_ADMISSION_ACTOR_CAPACITY: "12"
    MCP_ADMISSION_PROCESS_CAPACITY: "24"

ingress:
  install: false
  create: false
