global:
  host: "https://wandb.example.com"
  size: "large"
  api:
    enabled: true
  weave-trace:
    enabled: false

weave-trace:
  install: false

mcp-server:
  install: true
  performance:
    profile: "local"
  env:
    WANDB_INTERNAL_BASE_URL: "http://custom-wandb-api.platform.svc:8081"
    MCP_WORKLOAD_PROFILE: "shared"
    MCP_ADMISSION_ACTOR_CAPACITY: "99"
    MCP_ADMISSION_PROCESS_CAPACITY: "100"

api:
  containers:
    api:
      env:
        GORILLA_MCP_MYSQL_CONNECTIONS_PER_REQUEST: "9"
        GORILLA_MCP_SDK_GRAPHQL_QUERY_SECONDS: "10"

ingress:
  install: false
  create: false
