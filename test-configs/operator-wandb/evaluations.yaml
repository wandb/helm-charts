# Prerequisites: both databases/users, password Secrets, and this CA Secret exist.
# Example endpoints and Secret names only; this fixture contains no credentials.
global:
  host: https://evaluations.example.com
  api:
    enabled: true
  mysql:
    caCert:
      valueFrom:
        secretKeyRef:
          name: existing-mysql-ca
          key: rds-ca.pem
frontend:
  install: true
evaluations:
  install: true
  image:
    tag: server-release
  mysql:
    host: mysql.example.com
    user: ces
    passwordSecret:
      name: evaluations-mysql
      key: mysql-password
  clickhouse:
    host: example.clickhouse.cloud
    user: ces
    passwordSecret:
      name: evaluations-clickhouse
      key: clickhouse-password
