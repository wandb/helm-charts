global:
  host: https://customer.example.com
  cloudProvider: gcp
  legacyIngress: false
  traefikIngress: true
  ipAllowList:
    enabled: true
    userCIDRs: [0.0.0.0/0, '::/0']
ingress:
  install: true
  create: true
  issuer:
    create: true
    provider: google
  secondary:
    create: true
    nameOverride: secondary
