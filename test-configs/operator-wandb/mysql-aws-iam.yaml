global:
  api:
    enabled: true
  glue:
    enabled: true
  mysql:
    rdsIamAuth: true
    awsRegion: us-east-1
    host: wandb.cluster-abc.us-east-1.rds.amazonaws.com
    port: 3306
    database: wandb
    user: wandb_iam
    caCert: |
      -----BEGIN CERTIFICATE-----
      test-rds-ca-bundle
      -----END CERTIFICATE-----

app:
  initContainers:
    init-db:
      enabled: false
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

api:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

executor:
  install: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

filemeta:
  install: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

filestream:
  install: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

flat-run-fields-updater:
  install: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

history-updater:
  install: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

glue:
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

metric-observer:
  install: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

parquet:
  install: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

parquet-metadata-cache:
  install: true
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/wandb-database

prometheus:
  mysql-exporter:
    install: false

yace:
  install: true
  regions:
    - us-east-1
