global:
  glue:
    enabled: true
  olap:
    weaveTrace:
      enabled: true
      host: managed-clickhouse.example.com
  weaveBillingClickhouse:
    olap:
      enabled: true
      user:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: username
            optional: true
      password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: password
            optional: true
weave-trace:
  install: true
