global:
  glue:
    enabled: true
  olap:
    default:
      host: managed-clickhouse.example.com
    weaveTrace:
      enabled: true
    weaveBilling:
      enabled: true
      user:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: username
            optional: true
      password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: password
            optional: true
weave-trace:
  install: true
