# Managed-spec ESO Secrets replace inline datastore settings, the license and
# the server env. Inline values that still exist must not be used.
global:
  env:
    GORILLA_DISABLE_TELEMETRY: "true"
  host: "http://localhost:8080"
  size: testing
  api:
    enabled: true
  glue:
    enabled: true
  licenseSecret:
    name: managed-spec-license
    key: license
  envFrom:
    managed-spec-server-env: secretRef
    managed-spec-custom-env: secretRef
  mysql:
    host: inline-mysql-host
    password: inline-mysql-password
    fromSecret: managed-spec-mysql
  redis:
    host: inline-redis-host
    params:
      master: gorilla
    fromSecret: managed-spec-redis
executor:
  install: true
filemeta:
  install: true
filestream:
  install: true
flat-run-fields-updater:
  install: true
history-updater:
  install: true
metric-observer:
  install: true
parquet:
  install: true
parquet-metadata-cache:
  install: true
