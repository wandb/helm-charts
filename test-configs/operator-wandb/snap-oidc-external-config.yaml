global:
  host: https://wandb.example.com
  api:
    enabled: true
  auth:
    oidc:
      # Leftover inline settings must not leak into the external configuration.
      clientId: legacy-client
      issuer: https://legacy-idp.example.com
      authMethod: pkce
      secret: ignored-legacy-secret
      oidcConfigMap:
        name: customer-oidc
      oidcSecret:
        name: customer-oidc-secret
        secretKey: client-secret
app:
  extraCors:
    - https://legacy-extra.example.com
