global:
  host: https://customer.example.com
  cloudProvider: aws
  traefikIngress: true
  ipAllowList:
    enabled: true
    systemCIDRs: [10.0.0.0/8, '2001:db8::/32']
    userCIDRs: [192.0.2.0/24, '2001:db8::/32']
ingress:
  additionalHosts: [alias.example.com, '']
  annotations:
    external-dns.alpha.kubernetes.io/hostname: customer.example.com
    alb.ingress.kubernetes.io/scheme: internet-facing
