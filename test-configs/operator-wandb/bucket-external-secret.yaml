# External credentials must keep their existing references and URL expansion,
# including credential-before-URL ordering in the settings-migration job.
global:
  env:
    GORILLA_GLUE_DISABLE_TELEMETRY: "true"
  host: "http://localhost:8080"
  size: testing
  api:
    enabled: true
  bucket:
    provider: s3
    name: customer-bucket
    path: artifacts
    secret:
      secretName: customer-credentials
      accessKeyName: custom-access
      secretKeyName: custom-secret
settingsMigrationJob:
  install: true
lumen-agent:
  install: true
