# Both jobs use the requested size while their volumes, mounts, and staging
# environment variables follow their own component settings.
global:
  repositoryPrefix: ""
  lumen:
    stagingDirectorySize: 40Gi
processor:
  stagingDirectory:
    name: processor-scratch
    mountPath: /scratch/processor
compactor:
  stagingDirectory:
    name: compactor-scratch
    mountPath: /scratch/compactor
