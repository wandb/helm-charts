# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  # Linuxbrew is pre-installed; install Helm, chart-testing (ct), yamllint, kind.
  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
  brew install helm chart-testing yamllint kind
  echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"' >> $ENVRC
  # Plugins and formatter pinned to .github/workflows/test-operator-wandb.yaml and lint.yaml.
  helm plugin list | grep -q '^cascade' || helm plugin install https://github.com/origranot/helm-cascade --version v1.1.1 --verify=false
  helm plugin list | grep -q '^unittest' || helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.1 --verify=false
  # Always install the pinned helmfmt, verified against the digest lint.yaml checks.
  HELMFMT_VERSION=0.5.0
  HELMFMT_SHA256=17e6de3266b7bfeb50f4e425736d3362c3c7a01bf9756710b1d350f9ced78fb2
  mkdir -p "$HOME/.local/bin"
  curl -fsSL -o /tmp/helmfmt.tgz "https://github.com/digitalstudium/helmfmt/releases/download/v${HELMFMT_VERSION}/helmfmt_Linux_x86_64.tar.gz"
  echo "${HELMFMT_SHA256}  /tmp/helmfmt.tgz" | sha256sum --check --strict
  tar -xzf /tmp/helmfmt.tgz -C "$HOME/.local/bin" helmfmt
  rm -f /tmp/helmfmt.tgz
  echo "PATH=$HOME/.local/bin:$PATH" >> $ENVRC
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  # Pull subchart dependencies (recursive `helm dep build`).
  ./helm-dep-build.sh
knowledge:
  - name: lint
    contents: |
      ct lint --config ct.yaml --all
  - name: notes
    contents: |
      # Helm dep build adds the stakater chart repo defined in ct.yaml.
      # Snapshot/install tests need a local Kind cluster (see DEVELOPERS.md):
      #   ./setup-dev-cluster.sh && ./snapshots.sh build && ./snapshots.sh run
