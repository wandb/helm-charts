global:
  repositoryPrefix: ""
  lumen:
    dataRoot: ""
    # Each job has a separate ephemeral claim; this size applies to both.
    stagingDirectorySize: 20Gi
    # Terraform-provided per cluster aws-eks / azure-aks / google-gke.
    # It can be empty for GCP-direct deployments, where no WIF is rendered.
    gcpWorkloadIdentity:
      audience: ""

# Processor: hourly CronJob that moves agent exports to inbound, processes,
# and writes parquet to the data root.
processor:
  kind: CronJob
  image:
    repository: us-docker.pkg.dev/wandb-production/public/wandb/lumen
    tag: v0.1.5
  stagingDirectory:
    name: lumen-staging-dir
    mountPath: /vol/staging
  serviceAccount:
    annotations: {}
  globalOptOut:
    volumes: true
  podDisruptionBudget:
    enabled: false
  service:
    enabled: false
  cronJobs:
    processor:
      enabled: true
      schedule: "15 * * * *"
      concurrencyPolicy: "Forbid"
      failedJobsHistoryLimit: 3
      restartPolicy: "OnFailure"
      backoffLimit: 5
      successfulJobsHistoryLimit: 5
      startingDeadlineSeconds: 300
      volumesTpls:
        - '{{ include "wandb.lumenStagingVolume" . }}'
      containers:
        collector:
          command: ["/app/entrypoint.sh", "processor"]
          args: []
          env:
            GOMEMLIMIT:
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            GOMAXPROCS:
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
          envFrom:
            "{{ .Release.Name }}-processor-configmap": "configMapRef"
          volumeMountsTpls:
            - '{{ include "wandb.lumenStagingVolumeMount" . }}'
          resources:
            requests:
              cpu: 8
              memory: 12Gi
            limits:
              cpu: 12
              memory: 24Gi

# Compactor: hourly CronJob with separate staging storage so it can run
# alongside the processor.
compactor:
  kind: CronJob
  image:
    repository: us-docker.pkg.dev/wandb-production/public/wandb/lumen
    tag: v0.1.5
  stagingDirectory:
    name: lumen-compactor-staging-dir
    mountPath: /vol/compactor-staging
  serviceAccount:
    annotations: {}
  globalOptOut:
    volumes: true
  podDisruptionBudget:
    enabled: false
  service:
    enabled: false
  cronJobs:
    compactor:
      enabled: true
      schedule: "45 * * * *"
      concurrencyPolicy: "Forbid"
      failedJobsHistoryLimit: 3
      restartPolicy: "OnFailure"
      backoffLimit: 5
      successfulJobsHistoryLimit: 5
      startingDeadlineSeconds: 300
      volumesTpls:
        - '{{ include "wandb.lumenStagingVolume" . }}'
      containers:
        collector:
          command: ["/app/entrypoint.sh", "compactor"]
          args: []
          env:
            GOMEMLIMIT:
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            GOMAXPROCS:
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
          envFrom:
            "{{ .Release.Name }}-compactor-configmap": "configMapRef"
          volumeMountsTpls:
            - '{{ include "wandb.lumenStagingVolumeMount" . }}'
          resources:
            requests:
              cpu: 8
              memory: 12Gi
            limits:
              cpu: 12
              memory: 24Gi
