{{- $bucket := include "wandb.lumen.dataRoot" . -}}
{{/* Retain the legacy processor name while existing Jobs still reference it. */}}
{{- range $name, $component := dict "configmap" .Values.processor "processor-configmap" .Values.processor "compactor-configmap" .Values.compactor }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
data:
  LUMEN_DATA_ROOT: {{ $bucket | quote }}
  LUMEN_STAGING_ROOT: "file://{{ include "wandb.lumen.stagingPath" (dict "Values" $component) }}"

---
{{- end }}
