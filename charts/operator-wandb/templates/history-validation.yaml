{{- $liveStore := .Values.global.historyStore.liveStore -}}
{{- if not (has $liveStore (list "auto" "clickhouse")) -}}
  {{- fail (printf "global.historyStore.liveStore must be \"auto\" or \"clickhouse\", got %q" (toString $liveStore)) -}}
{{- end -}}

{{- if and (eq $liveStore "clickhouse") (not .Values.global.olap.history.enabled) -}}
  {{- fail "global.historyStore.liveStore \"clickhouse\" requires global.olap.history.enabled" -}}
{{- end -}}
