{{/*
  Validate the typed MCP parent-chart contract. This template emits no
  resources. It runs only when MCP is installed because it relies on the
  dependency's subchart scope to evaluate operator-provided templates.
*/}}
{{- $mcp := index .Values "mcp-server" | default dict -}}
{{- if index $mcp "install" -}}
  {{- $mcpTplContext := index .Subcharts "mcp-server" -}}
  {{- $mcpEnv := index $mcp "env" | default dict -}}
  {{- $mcpExtraEnv := index $mcp "extraEnv" | default dict -}}
  {{- $mcpContainers := index $mcp "containers" | default dict -}}
  {{- $mcpContainer := index $mcpContainers "mcp-server" | default dict -}}
  {{- $mcpContainerEnv := index $mcpContainer "env" | default dict -}}
  {{- $mcpEnvFrom := index $mcp "envFrom" | default dict -}}
  {{- $mcpContainerEnvFrom := index $mcpContainer "envFrom" | default dict -}}
  {{- $reservedEnvNames := include "wandb.mcpReservedEnvNames" . | fromJsonArray -}}
  {{- $reservedEnvPrefixes := list "WANDB_" "WEAVE_TRACE_" "WF_TRACE_" "WB_AGENT_" "MCP_" "MAX_" "SESSION_" "UVICORN_" "DD_" "OTEL_" -}}
  {{- $ownedBenignEnvNames := list "WANDB_SILENT" "WEAVE_SILENT" "WEAVE_DISABLED" "ENVIRONMENT" -}}

  {{/* The top-level image tuple is the sole immutable MCP image authority. */}}
  {{- $rootImageTpl := index $mcp "imageTpl" | default "" | toString | trim -}}
  {{- $containerImage := index $mcpContainer "image" | default dict -}}
  {{- $containerImageTpl := index $mcpContainer "imageTpl" | default "" | toString | trim -}}
  {{- if or $rootImageTpl $containerImage $containerImageTpl -}}
    {{- fail "MCP image overrides must use only mcp-server.image.repository, tag, and digest" -}}
  {{- end -}}
  {{- $image := index $mcp "image" | default dict -}}
  {{- $repository := index $image "repository" | default "" | toString | trim -}}
  {{- $repositoryPrefix := .Values.global.repositoryPrefix | default "" | toString | trim | trimSuffix "/" -}}
  {{- if and $repositoryPrefix (hasPrefix (printf "%s/" $repositoryPrefix) $repository) -}}
    {{- fail "mcp-server.image.repository must be relative when global.repositoryPrefix is configured" -}}
  {{- end -}}

  {{/* Removed typed blocks fail closed instead of being silently ignored. */}}
  {{- range $legacyKey := list "weave" "otel" "analytics" -}}
    {{- if hasKey $mcp $legacyKey -}}
      {{- fail (printf "mcp-server.%s is no longer supported; migrate to the typed v0.4 MCP profile interface" $legacyKey) -}}
    {{- end -}}
  {{- end -}}

  {{/* Generic environment channels cannot shadow the typed release contract. */}}
  {{- range $envName, $_ := $mcpEnv -}}
    {{- $reserved := include "wandb.isMcpReservedEnvName" (dict "name" $envName "reservedNames" $reservedEnvNames "reservedPrefixes" $reservedEnvPrefixes) -}}
    {{- if and (eq $reserved "true") (not (has $envName $ownedBenignEnvNames)) -}}
      {{- fail (printf "mcp-server.env.%s is release-controlled; use the typed MCP values" $envName) -}}
    {{- end -}}
  {{- end -}}
  {{- $ownedEnvValues := dict "WANDB_SILENT" "true" "WEAVE_SILENT" "true" "WEAVE_DISABLED" "true" "ENVIRONMENT" "production" -}}
  {{- range $envName, $expectedValue := $ownedEnvValues -}}
    {{- $actualValue := index $mcpEnv $envName | default "" | toString | trim | lower -}}
    {{- if ne $actualValue $expectedValue -}}
      {{- fail (printf "mcp-server.env.%s must remain %s" $envName $expectedValue) -}}
    {{- end -}}
  {{- end -}}
  {{- range $channelName, $channel := dict "mcp-server.extraEnv" $mcpExtraEnv "mcp-server.containers.mcp-server.env" $mcpContainerEnv -}}
    {{- range $envName, $_ := $channel -}}
      {{- $reserved := include "wandb.isMcpReservedEnvName" (dict "name" $envName "reservedNames" $reservedEnvNames "reservedPrefixes" $reservedEnvPrefixes) -}}
      {{- if eq $reserved "true" -}}
        {{- fail (printf "%s cannot set release-controlled MCP variable %s" $channelName $envName) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if or $mcpEnvFrom $mcpContainerEnvFrom -}}
    {{- fail "MCP envFrom is unsupported because opaque sources can shadow the release contract" -}}
  {{- end -}}
  {{- range $sizeName, $sizeValues := index $mcp "sizing" | default dict -}}
    {{- if index $sizeValues "env" | default dict -}}
      {{- fail (printf "mcp-server.sizing.%s.env is unsupported; the server-owned capacity class controls runtime policy" $sizeName) -}}
    {{- end -}}
    {{- if and (hasKey $sizeValues "replicaCount") (ne (index $sizeValues "replicaCount" | int) 1) -}}
      {{- fail (printf "mcp-server.sizing.%s.replicaCount must remain 1" $sizeName) -}}
    {{- end -}}
    {{- $sizeAutoscaling := index $sizeValues "autoscaling" | default dict -}}
    {{- $sizeHorizontal := index $sizeAutoscaling "horizontal" | default dict -}}
    {{- $sizeVertical := index $sizeAutoscaling "vertical" | default dict -}}
    {{- $sizeKeda := index $sizeAutoscaling "keda" | default dict -}}
    {{- if or (index $sizeHorizontal "enabled") (index $sizeVertical "enabled") (index $sizeKeda "enabled") -}}
      {{- fail (printf "mcp-server.sizing.%s autoscaling must remain disabled" $sizeName) -}}
    {{- end -}}
  {{- end -}}

  {{/* Exactly one canonical environment helper must be present. */}}
  {{- $canonicalMcpEnvTplCount := 0 -}}
  {{- range (index $mcp "envTpls" | default list) -}}
    {{- if kindIs "string" . -}}
      {{- $isCanonicalMcpEnvTpl := regexMatch `^\{\{-?\s*include\s+"wandb\.mcpEnvs"\s+\.\s*-?\}\}$` (trim .) -}}
      {{- if $isCanonicalMcpEnvTpl -}}
        {{- $canonicalMcpEnvTplCount = add1 $canonicalMcpEnvTplCount -}}
      {{- else -}}
        {{- range (tpl . $mcpTplContext | fromYamlArray) -}}
          {{- if not (kindIs "map" .) -}}
            {{- fail "mcp-server.envTpls entries must render a YAML array of environment maps" -}}
          {{- else -}}
            {{- $renderedName := index . "name" | default "" | toString -}}
            {{- $reserved := include "wandb.isMcpReservedEnvName" (dict "name" $renderedName "reservedNames" $reservedEnvNames "reservedPrefixes" $reservedEnvPrefixes) -}}
            {{- if eq $reserved "true" -}}
              {{- fail (printf "%s cannot be rendered by an alternate MCP environment template" $renderedName) -}}
            {{- end -}}
          {{- end -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if ne $canonicalMcpEnvTplCount 1 -}}
    {{- fail "mcp-server.envTpls must include wandb.mcpEnvs exactly once" -}}
  {{- end -}}

  {{/* Tool profile and access mode are the complete Dedicated product surface. */}}
  {{- $tools := index $mcp "tools" | default dict -}}
  {{- $rawToolProfile := index $tools "profile" | default "auto" -}}
  {{- if not (kindIs "string" $rawToolProfile) -}}
    {{- fail "mcp-server.tools.profile must be one of: auto, models-only, models-weave" -}}
  {{- end -}}
  {{- $toolProfile := $rawToolProfile | trim -}}
  {{- if not (has $toolProfile (list "auto" "models-only" "models-weave")) -}}
    {{- fail "mcp-server.tools.profile must be one of: auto, models-only, models-weave" -}}
  {{- end -}}
  {{- $rawAccessMode := index $mcp "accessMode" | default "read-write" -}}
  {{- if not (kindIs "string" $rawAccessMode) -}}
    {{- fail "mcp-server.accessMode must be one of: read-write, read-only" -}}
  {{- end -}}
  {{- $accessMode := $rawAccessMode | trim -}}
  {{- if not (has $accessMode (list "read-write" "read-only")) -}}
    {{- fail "mcp-server.accessMode must be one of: read-write, read-only" -}}
  {{- end -}}

  {{/* Trace availability resolves `auto`; the runtime receives an exact profile. */}}
  {{- $traceBackend := index $mcp "traceBackend" | default dict -}}
  {{- $rawTraceMode := index $traceBackend "mode" | default "auto" -}}
  {{- if not (kindIs "string" $rawTraceMode) -}}
    {{- fail "mcp-server.traceBackend.mode must be one of: auto, disabled" -}}
  {{- end -}}
  {{- $traceMode := $rawTraceMode | trim -}}
  {{- if not (has $traceMode (list "auto" "disabled")) -}}
    {{- fail "mcp-server.traceBackend.mode must be one of: auto, disabled" -}}
  {{- end -}}
  {{- $rawTraceURL := index $traceBackend "url" | default "" -}}
  {{- $traceError := "mcp-server.traceBackend.url must be an absolute HTTP(S) origin or /traces URL without credentials, query, or fragment" -}}
  {{- if not (kindIs "string" $rawTraceURL) -}}
    {{- fail $traceError -}}
  {{- end -}}
  {{- $traceURL := tpl $rawTraceURL $mcpTplContext | trim -}}
  {{- $hasTraceURL := ne $traceURL "" -}}
  {{- if and (eq $traceMode "disabled") $hasTraceURL -}}
    {{- fail "mcp-server.traceBackend.url must be empty when traceBackend.mode=disabled" -}}
  {{- end -}}
  {{- if $hasTraceURL -}}
    {{- include "wandb.validateMcpEndpoint" (dict "url" $traceURL "allowTraces" true "errorMessage" $traceError) -}}
  {{- end -}}
  {{- $globalWeaveTrace := index .Values.global "weave-trace" | default dict -}}
  {{- $hasTraceBackend := and (eq $traceMode "auto") (or $hasTraceURL (index $globalWeaveTrace "enabled")) -}}
  {{- $resolvedToolProfile := include "wandb.resolveMcpToolProfile" (dict "profile" $toolProfile "hasTraceBackend" $hasTraceBackend) -}}
  {{- if and (eq $resolvedToolProfile "models-weave") (not $hasTraceBackend) -}}
    {{- fail "mcp-server.tools.profile=models-weave requires global.weave-trace.enabled=true or traceBackend.url" -}}
  {{- end -}}

  {{/* Capacity is derived from the existing chart size, never a free-form MCP override. */}}
  {{- $deploymentSize := .Values.global.size | default "default" | toString | trim | lower -}}
  {{- if not (has $deploymentSize (list "default" "testing" "small" "medium" "large" "xlarge" "xxlarge")) -}}
    {{- fail "global.size must be one of: default, testing, small, medium, large, xlarge, xxlarge when MCP is installed" -}}
  {{- end -}}

  {{/* Routing stays typed and cannot silently point at a nonexistent Service. */}}
  {{- $routing := index $mcp "routing" | default dict -}}
  {{- $rawInternalURL := index $routing "internalBaseUrl" | default "" -}}
  {{- $internalError := "mcp-server.routing.internalBaseUrl must be an absolute HTTP(S) origin without credentials, path, query, or fragment" -}}
  {{- if not (kindIs "string" $rawInternalURL) -}}
    {{- fail $internalError -}}
  {{- end -}}
  {{- $internalURL := tpl $rawInternalURL $mcpTplContext | trim -}}
  {{- $hasInternalURLOverride := ne $internalURL "" -}}
  {{- if $hasInternalURLOverride -}}
    {{- include "wandb.validateMcpEndpoint" (dict "url" $internalURL "errorMessage" $internalError) -}}
  {{- else if .Values.global.api.enabled -}}
    {{- $api := index .Values "api" | default dict -}}
    {{- $apiService := index $api "service" | default dict -}}
    {{- if not (index $apiService "enabled") -}}
      {{- fail "mcp-server.routing.internalBaseUrl is required when global.api.enabled=true and api.service.enabled=false" -}}
    {{- end -}}
    {{- $apiPortIsDefault := false -}}
    {{- range (index $apiService "ports" | default list) -}}
      {{- if and (eq (index . "name" | default "" | toString) "http") (eq (index . "port" | toString) "8081") -}}
        {{- $apiPortIsDefault = true -}}
      {{- end -}}
    {{- end -}}
    {{- $apiNamingIsCustom := or (ne (index $api "nameOverride" | default "" | toString | trim) "") (ne (index $api "fullnameOverride" | default "" | toString | trim) "") (ne (index $apiService "name" | default "" | toString | trim) "") -}}
    {{- if or $apiNamingIsCustom (not $apiPortIsDefault) -}}
      {{- fail "mcp-server.routing.internalBaseUrl is required when api naming or the http Service port is overridden" -}}
    {{- end -}}
  {{- else -}}
    {{- $app := index .Values "app" | default dict -}}
    {{- $appService := index $app "service" | default dict -}}
    {{- if or (not (index $app "install")) (not (index $appService "enabled")) -}}
      {{- fail "mcp-server.routing.internalBaseUrl is required when the monolith app Service is disabled" -}}
    {{- end -}}
    {{- $appPortIsDefault := false -}}
    {{- range (index $appService "ports" | default list) -}}
      {{- if and (eq (index . "name" | default "" | toString) "app") (eq (index . "port" | toString) "8080") -}}
        {{- $appPortIsDefault = true -}}
      {{- end -}}
    {{- end -}}
    {{- $appNamingIsCustom := or (ne (index $app "nameOverride" | default "" | toString | trim) "") (ne (index $app "fullnameOverride" | default "" | toString | trim) "") (ne (index $appService "name" | default "" | toString | trim) "") -}}
    {{- if or $appNamingIsCustom (not $appPortIsDefault) -}}
      {{- fail "mcp-server.routing.internalBaseUrl is required when app naming or the app Service port is overridden" -}}
    {{- end -}}
  {{- end -}}

  {{/* Kubernetes observability is bounded to credential-free in-cluster paths. */}}
  {{- $observability := index $mcp "observability" | default dict -}}
  {{- $rawProvider := index $observability "provider" | default "none" -}}
  {{- if not (kindIs "string" $rawProvider) -}}
    {{- fail "mcp-server.observability.provider must be one of: none, datadog-agent, otel" -}}
  {{- end -}}
  {{- $provider := $rawProvider | trim -}}
  {{- if not (has $provider (list "none" "datadog-agent" "otel")) -}}
    {{- fail "mcp-server.observability.provider must be one of: none, datadog-agent, otel" -}}
  {{- end -}}
  {{- $rawPrivacy := index $observability "privacy" | default "standard" -}}
  {{- if not (kindIs "string" $rawPrivacy) -}}
    {{- fail "mcp-server.observability.privacy must be one of: off, standard, strict" -}}
  {{- end -}}
  {{- $privacy := $rawPrivacy | trim -}}
  {{- if not (has $privacy (list "off" "standard" "strict")) -}}
    {{- fail "mcp-server.observability.privacy must be one of: off, standard, strict" -}}
  {{- end -}}

  {{/* Temporary compatibility for the current Managed Spec MCP fragment. */}}
  {{- $legacyDatadog := index $mcp "datadog" | default dict -}}
  {{- if $legacyDatadog -}}
    {{- range $legacyKey := keys $legacyDatadog -}}
      {{- if not (has $legacyKey (list "enabled" "mode" "env" "service" "deploymentType")) -}}
        {{- fail (printf "mcp-server.datadog.%s is not supported by the v0.4 compatibility bridge" $legacyKey) -}}
      {{- end -}}
    {{- end -}}
    {{- $legacyEnabled := index $legacyDatadog "enabled" | default false -}}
    {{- if not (kindIs "bool" $legacyEnabled) -}}
      {{- fail "mcp-server.datadog.enabled must be a boolean" -}}
    {{- end -}}
    {{- $legacyMode := index $legacyDatadog "mode" | default "agent" | toString | trim | lower -}}
    {{- if ne $legacyMode "agent" -}}
      {{- fail "mcp-server.datadog.mode must be agent; direct forwarding and pod-held credentials are unsupported" -}}
    {{- end -}}
    {{- if and $legacyEnabled (not (has $provider (list "none" "datadog-agent"))) -}}
      {{- fail "mcp-server.datadog.enabled=true conflicts with mcp-server.observability.provider" -}}
    {{- end -}}
    {{- if and (hasKey $legacyDatadog "enabled") (not $legacyEnabled) (eq $provider "datadog-agent") -}}
      {{- fail "mcp-server.datadog.enabled=false conflicts with mcp-server.observability.provider=datadog-agent" -}}
    {{- end -}}
    {{- range $field := list "env" "service" "deploymentType" -}}
      {{- if hasKey $legacyDatadog $field -}}
        {{- $value := index $legacyDatadog $field -}}
        {{- if or (not (kindIs "string" $value)) (not (regexMatch `^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$` $value)) -}}
          {{- fail (printf "mcp-server.datadog.%s must be a bounded telemetry label" $field) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- $legacyPrivacy := index $mcp "privacy" | default dict -}}
  {{- if $legacyPrivacy -}}
    {{- range $legacyKey := keys $legacyPrivacy -}}
      {{- if ne $legacyKey "logLevel" -}}
        {{- fail (printf "mcp-server.privacy.%s is not supported by the v0.4 compatibility bridge" $legacyKey) -}}
      {{- end -}}
    {{- end -}}
    {{- $legacyPrivacyLevel := index $legacyPrivacy "logLevel" | default "standard" -}}
    {{- if or (not (kindIs "string" $legacyPrivacyLevel)) (not (has $legacyPrivacyLevel (list "off" "standard" "strict"))) -}}
      {{- fail "mcp-server.privacy.logLevel must be one of: off, standard, strict" -}}
    {{- end -}}
    {{- if and (ne $privacy "standard") (ne $privacy $legacyPrivacyLevel) -}}
      {{- fail "mcp-server.privacy.logLevel conflicts with mcp-server.observability.privacy" -}}
    {{- end -}}
  {{- end -}}

  {{/* OTEL uses the chart's canonical daemonset or explicit global endpoint. */}}
  {{- if eq $provider "otel" -}}
    {{- $globalOtel := index .Values.global "otel" | default dict -}}
    {{- $otelTraces := index $globalOtel "traces" | default dict -}}
    {{- $rawOtelHost := index $otelTraces "host" | default "" -}}
    {{- if not (kindIs "string" $rawOtelHost) -}}
      {{- fail "global.otel.traces.host must be a DNS hostname" -}}
    {{- end -}}
    {{- $otelHost := tpl $rawOtelHost $mcpTplContext | trim -}}
    {{- if and (ne $otelHost "") (not (regexMatch `^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)([.]([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?))*$` $otelHost)) -}}
      {{- fail "global.otel.traces.host must be a DNS hostname" -}}
    {{- end -}}
    {{- $otelPort := index $otelTraces "port" | default 4317 | int -}}
    {{- if or (lt $otelPort 1) (gt $otelPort 65535) -}}
      {{- fail "global.otel.traces.port must be between 1 and 65535" -}}
    {{- end -}}
    {{- $otelProto := index $otelTraces "proto" | default "grpc" | toString | trim | lower -}}
    {{- if not (has $otelProto (list "grpc" "http")) -}}
      {{- fail "global.otel.traces.proto must be one of: grpc, http" -}}
    {{- end -}}
    {{- if and (eq $otelHost "") (or (not (index .Values "otel" "install")) (not (index .Values "otel" "daemonset" "install"))) -}}
      {{- fail "mcp-server.observability.provider=otel requires the OTEL daemonset or global.otel.traces.host" -}}
    {{- end -}}
  {{- end -}}

  {{/* Dedicated v0.4 keeps isolation, no Kubernetes API access, and one pod. */}}
  {{- $globalOptOut := index $mcp "globalOptOut" | default dict -}}
  {{- $rawGlobalOptOutEnv := index $globalOptOut "env" -}}
  {{- $globalOptOutEnv := false -}}
  {{- if kindIs "string" $rawGlobalOptOutEnv -}}
    {{- $globalOptOutEnv = eq (tpl $rawGlobalOptOutEnv $mcpTplContext | trim | lower) "true" -}}
  {{- else -}}
    {{- $globalOptOutEnv = $rawGlobalOptOutEnv -}}
  {{- end -}}
  {{- if not $globalOptOutEnv -}}
    {{- fail "mcp-server.globalOptOut.env must remain true to isolate MCP from global administrative environment" -}}
  {{- end -}}
  {{- $serviceAccount := index $mcp "serviceAccount" | default dict -}}
  {{- if or (not (index $serviceAccount "create")) (index $serviceAccount "automount") -}}
    {{- fail "mcp-server must use its dedicated service account with token automount disabled" -}}
  {{- end -}}
  {{- $role := index $mcp "role" | default dict -}}
  {{- if index $role "create" -}}
    {{- fail "mcp-server.role.create must remain false because MCP needs no Kubernetes RBAC" -}}
  {{- end -}}
  {{- if ne (index $mcp "replicaCount" | default 1 | int) 1 -}}
    {{- fail "mcp-server.replicaCount must remain 1 in the Dedicated v0.4 contract" -}}
  {{- end -}}
  {{- $autoscaling := index $mcp "autoscaling" | default dict -}}
  {{- $horizontal := index $autoscaling "horizontal" | default dict -}}
  {{- $vertical := index $autoscaling "vertical" | default dict -}}
  {{- $keda := index $autoscaling "keda" | default dict -}}
  {{- if or (index $horizontal "enabled") (index $vertical "enabled") (index $keda "enabled") -}}
    {{- fail "mcp-server HPA, VPA, and KEDA must remain disabled in the Dedicated v0.4 contract" -}}
  {{- end -}}
  {{- $service := index $mcp "service" | default dict -}}
  {{- if or (not (index $service "enabled")) (ne (index $service "type" | default "" | toString) "ClusterIP") -}}
    {{- fail "mcp-server.service must remain an enabled internal ClusterIP" -}}
  {{- end -}}
{{- end -}}
