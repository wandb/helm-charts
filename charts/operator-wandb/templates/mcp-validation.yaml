{{/*
  Validate the MCP parent-chart contract. This template emits no resources.
  It runs only when MCP is installed because it relies on the dependency's
  subchart scope to evaluate operator-provided templates correctly.
*/}}
{{- $mcp := index .Values "mcp-server" | default dict -}}
{{- if index $mcp "install" -}}
  {{- $mcpEnv := index $mcp "env" | default dict -}}
  {{- $mcpExtraEnv := index $mcp "extraEnv" | default dict -}}
  {{- $mcpContainers := index $mcp "containers" | default dict -}}
  {{- $mcpContainer := index $mcpContainers "mcp-server" | default dict -}}
  {{- $mcpContainerEnv := index $mcpContainer "env" | default dict -}}
  {{- $mcpSizing := index $mcp "sizing" | default dict -}}
  {{- $mcpTplContext := index .Subcharts "mcp-server" -}}
  {{- $weaveToolsEnvName := "WANDB_MCP_ENABLE_WEAVE_TOOLS" -}}
  {{- $canonicalOnlyEnvNames := list "WANDB_BASE_URL" "WANDB_INTERNAL_BASE_URL" "WF_TRACE_SERVER_URL" "WB_AGENT_BASE_URL" "WANDB_MCP_ENABLE_ARIA_TOOLS" $weaveToolsEnvName -}}

  {{/* Generated routing values must have one source so they cannot shadow validation. */}}
  {{- if hasKey $mcpEnv "WANDB_BASE_URL" -}}
    {{- fail "WANDB_BASE_URL is chart-managed from global.host and cannot be set in mcp-server.env" -}}
  {{- end -}}
  {{- if hasKey $mcpEnv $weaveToolsEnvName -}}
    {{- fail "mcp-server.env.WANDB_MCP_ENABLE_WEAVE_TOOLS is chart-managed; use mcp-server.weave.tools" -}}
  {{- end -}}
  {{- range $channelName, $channel := dict "mcp-server.extraEnv" $mcpExtraEnv "mcp-server.containers.mcp-server.env" $mcpContainerEnv -}}
    {{- range $reservedName := $canonicalOnlyEnvNames -}}
      {{- if hasKey $channel $reservedName -}}
        {{- fail (printf "%s cannot be set in alternate MCP environment channel %s" $reservedName $channelName) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- range $sizeName, $sizeValues := $mcpSizing -}}
    {{- $sizeEnv := index $sizeValues "env" | default dict -}}
    {{- range $reservedName := $canonicalOnlyEnvNames -}}
      {{- if hasKey $sizeEnv $reservedName -}}
        {{- fail (printf "%s cannot be set in alternate MCP environment channel mcp-server.sizing.%s.env" $reservedName $sizeName) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- $hasMcpEnvTpl := false -}}
  {{- range (index $mcp "envTpls" | default list) -}}
    {{- if kindIs "string" . -}}
      {{- $isCanonicalMcpEnvTpl := eq (trim .) "{{ include \"wandb.mcpEnvs\" . }}" -}}
      {{- if $isCanonicalMcpEnvTpl -}}
        {{- $hasMcpEnvTpl = true -}}
      {{- else -}}
        {{- range (tpl . $mcpTplContext | fromYamlArray) -}}
          {{- $renderedName := index . "name" | default "" | toString -}}
          {{- if has $renderedName $canonicalOnlyEnvNames -}}
            {{- fail (printf "%s cannot be rendered by an alternate MCP environment template" $renderedName) -}}
          {{- end -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if not $hasMcpEnvTpl -}}
    {{- fail "mcp-server.envTpls must include wandb.mcpEnvs" -}}
  {{- end -}}

  {{/* ARIA is the one cross-field opt-in: enabling it requires a safe origin. */}}
  {{- $rawAriaEnabled := index $mcpEnv "WANDB_MCP_ENABLE_ARIA_TOOLS" -}}
  {{- $ariaEnabled := "" -}}
  {{- if kindIs "bool" $rawAriaEnabled -}}
    {{- $ariaEnabled = ternary "true" "false" $rawAriaEnabled -}}
  {{- else if kindIs "string" $rawAriaEnabled -}}
    {{- $ariaEnabled = tpl $rawAriaEnabled $mcpTplContext | trim | lower -}}
  {{- end -}}
  {{- if not (has $ariaEnabled (list "true" "false")) -}}
    {{- fail "mcp-server.env.WANDB_MCP_ENABLE_ARIA_TOOLS must be true or false" -}}
  {{- end -}}
  {{- if eq $ariaEnabled "true" -}}
    {{- if not (hasKey $mcpEnv "WB_AGENT_BASE_URL") -}}
      {{- fail "mcp-server.env.WANDB_MCP_ENABLE_ARIA_TOOLS=true requires an explicit mcp-server.env.WB_AGENT_BASE_URL" -}}
    {{- end -}}
    {{- $rawAriaBaseURL := index $mcpEnv "WB_AGENT_BASE_URL" -}}
    {{- $ariaError := "mcp-server.env.WB_AGENT_BASE_URL must be an approved absolute HTTPS origin without credentials, path, query, or fragment" -}}
    {{- if not (kindIs "string" $rawAriaBaseURL) -}}
      {{- fail $ariaError -}}
    {{- end -}}
    {{- include "wandb.validateMcpEndpoint" (dict "url" (tpl $rawAriaBaseURL $mcpTplContext | trim) "httpsOnly" true "errorMessage" $ariaError) -}}
  {{- end -}}

  {{- $globalOptOut := index $mcp "globalOptOut" | default dict -}}
  {{- $rawGlobalOptOutEnv := index $globalOptOut "env" -}}
  {{- $globalOptOutEnv := false -}}
  {{- if kindIs "string" $rawGlobalOptOutEnv -}}
    {{- $globalOptOutEnv = eq (tpl $rawGlobalOptOutEnv $mcpTplContext | trim | lower) "true" -}}
  {{- else -}}
    {{- $globalOptOutEnv = $rawGlobalOptOutEnv -}}
  {{- end -}}
  {{- if not $globalOptOutEnv -}}
    {{- fail "mcp-server.globalOptOut.env must remain true to isolate MCP from global administrative environment" -}}
  {{- end -}}

  {{/* Default topology is safe; custom naming, ports, or Services require an origin. */}}
  {{- $hasInternalURLOverride := hasKey $mcpEnv "WANDB_INTERNAL_BASE_URL" -}}
  {{- if $hasInternalURLOverride -}}
    {{- $rawInternalURL := index $mcpEnv "WANDB_INTERNAL_BASE_URL" -}}
    {{- $internalError := "mcp-server.env.WANDB_INTERNAL_BASE_URL must be an absolute HTTP(S) origin without credentials, path, query, or fragment" -}}
    {{- if not (kindIs "string" $rawInternalURL) -}}
      {{- fail $internalError -}}
    {{- end -}}
    {{- include "wandb.validateMcpEndpoint" (dict "url" (tpl $rawInternalURL $mcpTplContext | trim) "errorMessage" $internalError) -}}
  {{- else if .Values.global.api.enabled -}}
    {{- $api := index .Values "api" | default dict -}}
    {{- $apiService := index $api "service" | default dict -}}
    {{- if not (index $apiService "enabled") -}}
      {{- fail "mcp-server.env.WANDB_INTERNAL_BASE_URL is required when global.api.enabled=true and api.service.enabled=false" -}}
    {{- end -}}
    {{- $apiPortIsDefault := false -}}
    {{- range (index $apiService "ports" | default list) -}}
      {{- if and (eq (index . "name" | default "" | toString) "http") (eq (index . "port" | toString) "8081") -}}
        {{- $apiPortIsDefault = true -}}
      {{- end -}}
    {{- end -}}
    {{- $apiNamingIsCustom := or (ne (index $api "nameOverride" | default "" | toString | trim) "") (ne (index $api "fullnameOverride" | default "" | toString | trim) "") (ne (index $apiService "name" | default "" | toString | trim) "") -}}
    {{- if or $apiNamingIsCustom (not $apiPortIsDefault) -}}
      {{- fail "mcp-server.env.WANDB_INTERNAL_BASE_URL is required when api naming or the http Service port is overridden" -}}
    {{- end -}}
  {{- else -}}
    {{- $app := index .Values "app" | default dict -}}
    {{- $appService := index $app "service" | default dict -}}
    {{- if or (not (index $app "install")) (not (index $appService "enabled")) -}}
      {{- fail "mcp-server.env.WANDB_INTERNAL_BASE_URL is required when the monolith app Service is disabled" -}}
    {{- end -}}
    {{- $appPortIsDefault := false -}}
    {{- range (index $appService "ports" | default list) -}}
      {{- if and (eq (index . "name" | default "" | toString) "app") (eq (index . "port" | toString) "8080") -}}
        {{- $appPortIsDefault = true -}}
      {{- end -}}
    {{- end -}}
    {{- $appNamingIsCustom := or (ne (index $app "nameOverride" | default "" | toString | trim) "") (ne (index $app "fullnameOverride" | default "" | toString | trim) "") (ne (index $appService "name" | default "" | toString | trim) "") -}}
    {{- if or $appNamingIsCustom (not $appPortIsDefault) -}}
      {{- fail "mcp-server.env.WANDB_INTERNAL_BASE_URL is required when app naming or the app Service port is overridden" -}}
    {{- end -}}
  {{- end -}}

  {{- $mcpWeave := index $mcp "weave" | default dict -}}
  {{- $rawWeaveMode := "auto" -}}
  {{- if hasKey $mcpWeave "tools" -}}
    {{- $rawWeaveMode = index $mcpWeave "tools" -}}
  {{- end -}}
  {{- $weaveMode := include "wandb.resolveMcpWeaveMode" (dict "value" $rawWeaveMode "context" $mcpTplContext) -}}
  {{- if not (has $weaveMode (list "auto" "true" "false")) -}}
    {{- fail "mcp-server.weave.tools must be one of: auto, true, false" -}}
  {{- end -}}
  {{- $rawTraceURL := "" -}}
  {{- if hasKey $mcpEnv "WF_TRACE_SERVER_URL" -}}
    {{- $rawTraceURL = index $mcpEnv "WF_TRACE_SERVER_URL" -}}
  {{- end -}}
  {{- $traceError := "mcp-server.env.WF_TRACE_SERVER_URL must be an absolute HTTP(S) origin or /traces URL without credentials, query, or fragment" -}}
  {{- if and (hasKey $mcpEnv "WF_TRACE_SERVER_URL") (not (kindIs "string" $rawTraceURL)) -}}
    {{- fail $traceError -}}
  {{- end -}}
  {{- $traceURL := "" -}}
  {{- if kindIs "string" $rawTraceURL -}}
    {{- $traceURL = tpl $rawTraceURL $mcpTplContext | trim -}}
  {{- end -}}
  {{- $hasTraceURL := ne $traceURL "" -}}
  {{- if $hasTraceURL -}}
    {{- include "wandb.validateMcpEndpoint" (dict "url" $traceURL "allowTraces" true "errorMessage" $traceError) -}}
  {{- end -}}
  {{- $globalWeaveTrace := index .Values.global "weave-trace" | default dict -}}
  {{- $hasBundledTrace := or (index .Values "weave-trace" "install") (index $globalWeaveTrace "enabled") -}}
  {{- $hasUsableTraceBackend := $hasBundledTrace -}}
  {{- if hasKey $mcpEnv "WF_TRACE_SERVER_URL" -}}
    {{- $hasUsableTraceBackend = $hasTraceURL -}}
  {{- end -}}
  {{- if and (eq $weaveMode "true") (not $hasUsableTraceBackend) -}}
    {{- fail "mcp-server.weave.tools=true requires weave-trace.install=true, global.weave-trace.enabled=true, or mcp-server.env.WF_TRACE_SERVER_URL" -}}
  {{- end -}}
{{- end -}}
