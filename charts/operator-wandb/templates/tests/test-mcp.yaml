{{- if index .Values "mcp-server" "install" }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "wandb.fullname" . }}-test-mcp"
  labels:
    {{- include "wandb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  {{- $profile := include "wandb.testSecurityProfile" (dict "root" . "name" "mcp") | fromYaml }}
  {{- if $profile.enabled }}
  automountServiceAccountToken: {{ $profile.automountServiceAccountToken }}
  securityContext:
    {{- include "wandb-base.podSecurityProfile" (dict "context" dict "profile" $profile) | nindent 4 }}
  {{- end }}
  containers:
    - name: mcp-health
  {{- if $profile.enabled }}
      securityContext:
        {{- include "wandb-base.containerSecurityProfile" (dict "context" dict "profile" $profile) | nindent 8 }}
  {{- end }}
      image: busybox:1.36
      command: ['wget', '--spider', '-q']
      args: ['http://{{ include "wandb.mcpServiceName" . }}:{{ include "wandb.mcpServicePort" . }}/mcp/health']
  restartPolicy: Never
{{- end }}
