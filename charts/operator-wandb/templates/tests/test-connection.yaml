apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "wandb.fullname" . }}-test-connection"
  labels:
    {{- include "wandb.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
{{- $profile := include "wandb.testSecurityProfile" (dict "root" . "name" "connection") | fromYaml }}
{{- if $profile.enabled }}
  automountServiceAccountToken: {{ $profile.automountServiceAccountToken }}
  securityContext:
    {{- include "wandb-base.podSecurityProfile" (dict "context" dict "profile" $profile) | nindent 4 }}
{{- end }}
  containers:
    - name: wandb-verify
{{- if $profile.enabled }}
      securityContext:
        {{- include "wandb-base.containerSecurityProfile" (dict "context" dict "profile" $profile) | nindent 8 }}
{{- end }}
      image: us-docker.pkg.dev/wandb-production/public/python:3.12
      env:
        - name: WANDB_BASE_URL
          value: "http://{{ .Release.Name }}-nginx:8080"
        - name: WANDB_API_KEY
          value: {{ dig "env" "GLOBAL_ADMIN_API_KEY" "" .Values.global | quote }}
      command:
        - sh
        - -c
        - |
          pip install wandb==0.30.0 && python -u - <<'PYTHON'
{{ .Files.Get "files/verify_connection.py" | indent 10 }}
          PYTHON
  restartPolicy: Never
