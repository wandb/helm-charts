{{- $oidc := .Values.global.auth.oidc -}}
{{- $config := $oidc.oidcConfigMap | default dict -}}
{{- if $config.name -}}
  {{- range $key := list "clientIdKey" "issuerKey" "authMethodKey" "corsOriginsKey" -}}
    {{- $_ := required (printf "global.auth.oidc.oidcConfigMap.%s is required when oidcConfigMap.name is set" $key) (index $config $key) -}}
  {{- end -}}
  {{- $wouldCreateInlineSecret := and $oidc.secret (not $oidc.oidcSecret.name) -}}
  {{- if $wouldCreateInlineSecret -}}
    {{- fail "global.auth.oidc.oidcSecret.name is required when oidcConfigMap.name and an inline OIDC secret are set" -}}
  {{- end -}}
{{- end -}}

{{- if and .Values.global.auth.oidc.secret (not .Values.global.auth.oidc.oidcSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wandb.oidc.secretSecret" . }}
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
data:
  {{ .Values.global.auth.oidc.oidcSecret.secretKey }}: {{ .Values.global.auth.oidc.secret | b64enc }}
---
{{- end }}

{{- if and .Values.app.internalJWTMap (gt (len .Values.app.internalJWTMap) 0) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-oidc-reviewer
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: Group
    name: system:unauthenticated
    apiGroup: rbac.authorization.k8s.io
{{- end }}
