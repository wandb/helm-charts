{{- $oidc := .Values.global.auth.oidc -}}
{{- if not $oidc.oidcConfigMap.name -}}
  {{- $name := include "wandb.oidc.configMapName" . -}}
  {{- $existing := lookup "v1" "ConfigMap" .Release.Namespace $name | default dict -}}
  {{- $metadata := get $existing "metadata" | default dict -}}
  {{- $annotations := get $metadata "annotations" | default dict -}}
  {{- $consoleManaged := eq (get $annotations "wandb.ai/console-managed") "true" -}}
  {{- $data := dict -}}
  {{- if $consoleManaged -}}
    {{- /* Empty data is intentional when Console disables OIDC; never fall back to inline values. */ -}}
    {{- $data = get $existing "data" | default dict -}}
  {{- else -}}
    {{- $corsOrigins := list -}}
    {{- if $oidc.clientId -}}
      {{- $_ := set $data "GORILLA_OIDC_CLIENT_ID" ($oidc.clientId | toString) -}}
      {{- $_ := set $data "GORILLA_OIDC_ISSUER" ($oidc.issuer | toString) -}}
      {{- $_ := set $data "GORILLA_AUTH_METHOD" ($oidc.authMethod | toString) -}}
      {{- /* Retain the environment names used by existing app versions. */ -}}
      {{- $_ := set $data "OIDC_CLIENT_ID" ($oidc.clientId | toString) -}}
      {{- $_ := set $data "OIDC_ISSUER" ($oidc.issuer | toString) -}}
      {{- $_ := set $data "OIDC_AUTH_METHOD" ($oidc.authMethod | toString) -}}
      {{- $corsOrigins = list .Values.global.host "null" | compact -}}
    {{- end -}}
    {{- if .Values.app.extraCors -}}
      {{- $corsOrigins = concat .Values.app.extraCors $corsOrigins | compact -}}
    {{- end -}}
    {{- if gt (len $corsOrigins) 0 -}}
      {{- $_ := set $data "GORILLA_CORS_ORIGINS" (join "," $corsOrigins) -}}
    {{- end -}}
  {{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  annotations:
    # Retain the resource when switching to an external reference with the same name.
    "helm.sh/resource-policy": "keep"
  {{- if $consoleManaged }}
    "wandb.ai/console-managed": "true"
  {{- end }}
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
data:
  {{- $data | toYaml | nindent 2 }}
---
{{- end }}

{{- if not $oidc.oidcSecret.name -}}
  {{- $name := include "wandb.oidc.secretSecret" . -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict -}}
  {{- $metadata := get $existing "metadata" | default dict -}}
  {{- $annotations := get $metadata "annotations" | default dict -}}
  {{- $consoleManaged := eq (get $annotations "wandb.ai/console-managed") "true" -}}
  {{- if or $oidc.secret $consoleManaged -}}
    {{- $data := dict -}}
    {{- if $consoleManaged -}}
      {{- /* Secret data is already base64 encoded; preserve empty data without restoring inline credentials. */ -}}
      {{- $data = get $existing "data" | default dict -}}
    {{- else -}}
      {{- $_ := set $data $oidc.oidcSecret.secretKey ($oidc.secret | b64enc) -}}
    {{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    "helm.sh/resource-policy": "keep"
    {{- if $consoleManaged }}
    "wandb.ai/console-managed": "true"
    {{- end }}
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
data:
    {{- $data | toYaml | nindent 2 }}
---
  {{- end }}
{{- end }}

{{- if and .Values.app.internalJWTMap (gt (len .Values.app.internalJWTMap) 0) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-oidc-reviewer
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: Group
    name: system:unauthenticated
    apiGroup: rbac.authorization.k8s.io
{{- end }}
