{{- $ca := .Values.global.mysql.caCert }}
{{- if and .Values.evaluations.install (kindIs "string" $ca) (not (empty $ca)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-evaluations-mysql-ca
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    # Retain for API pods. The next upgrade replaces it before running migrations.
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
type: Opaque
data:
  mysql_ca.pem: {{ $ca | b64enc }}
{{- end }}
