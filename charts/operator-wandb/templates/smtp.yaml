{{- $email := .Values.global.email | default dict -}}
{{- $smtp := $email.smtp | default dict -}}
{{- $name := include "wandb.smtp.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict -}}
{{- $metadata := $existing.metadata | default dict -}}
{{- $annotations := $metadata.annotations | default dict -}}
{{- $consoleManaged := eq (get $annotations "wandb.ai/console-managed") "true" -}}
{{- $data := dict -}}
{{- if $consoleManaged -}}
  {{- $data = $existing.data | default dict -}}
{{- else -}}
  {{- $host := include "wandb.smtp.resolveValue" (dict "root" . "field" "host" "value" ($smtp.host)) -}}
  {{- $port := include "wandb.smtp.resolveValue" (dict "root" . "field" "port" "value" ($smtp.port | default 587)) -}}
  {{- $user := include "wandb.smtp.resolveValue" (dict "root" . "field" "user" "value" ($smtp.user)) -}}
  {{- $password := include "wandb.smtp.resolveValue" (dict "root" . "field" "password" "value" ($smtp.password)) -}}
  {{- $sink := "https://api.wandb.ai/email/dispatch" -}}
  {{- if $host -}}
    {{- $sink = printf "smtp://%s:%s@%s:%s" $user $password $host $port -}}
  {{- end -}}
  {{- $data = dict "SMTP_HOST" ($host | b64enc) "SMTP_PORT" ($port | b64enc) "SMTP_USER" ($user | b64enc) "SMTP_PASSWORD" ($password | b64enc) "GORILLA_EMAIL_SINK" ($sink | b64enc) -}}
  {{- $mailFrom := include "wandb.smtp.resolveValue" (dict "root" . "field" "mailFrom" "value" $smtp.mailFrom) -}}
  {{- if $mailFrom -}}
    {{- $_ := set $data "GORILLA_EMAIL_FROM_ADDRESS" ($mailFrom | b64enc) -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  annotations:
    helm.sh/resource-policy: keep
{{- if $consoleManaged }}
    wandb.ai/console-managed: "true"
{{- end }}
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
