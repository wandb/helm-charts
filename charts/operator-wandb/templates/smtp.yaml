{{- $email := .Values.global.email | default dict -}}
{{- $smtp := $email.smtp | default dict -}}
{{- $name := include "wandb.smtp.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict -}}
{{- $metadata := $existing.metadata | default dict -}}
{{- $annotations := $metadata.annotations | default dict -}}
{{- $consoleManaged := eq (get $annotations "wandb.ai/console-managed") "true" -}}
{{- $data := dict -}}
{{- if $consoleManaged -}}
  {{- $data = $existing.data | default dict -}}
{{- else -}}
  {{- $fields := dict "host" "SMTP_HOST" "port" "SMTP_PORT" "user" "SMTP_USER" "password" "SMTP_PASSWORD" "mailFrom" "GORILLA_EMAIL_FROM_ADDRESS" -}}
  {{- range $field, $env := $fields -}}
    {{- $value := get $smtp $field -}}
    {{- if eq $field "port" -}}
      {{- $value = $value | default 587 -}}
    {{- end -}}
    {{- $external := and (kindIs "map" $value) (hasKey $value "valueFrom") -}}
    {{- if not $external -}}
      {{- $inline := include "wandb.smtp.inlineValue" $value -}}
      {{- if or (ne $field "mailFrom") $inline -}}
        {{- $_ := set $data $env ($inline | b64enc) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if not (include "wandb.smtp.hasConnectionRefs" .) -}}
    {{- $host := get $data "SMTP_HOST" | b64dec -}}
    {{- $sink := "https://api.wandb.ai/email/dispatch" -}}
    {{- if $host -}}
      {{- $sink = printf "smtp://%s:%s@%s:%s" (get $data "SMTP_USER" | b64dec) (get $data "SMTP_PASSWORD" | b64dec) $host (get $data "SMTP_PORT" | b64dec) -}}
    {{- end -}}
    {{- $_ := set $data "GORILLA_EMAIL_SINK" ($sink | b64enc) -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  annotations:
    helm.sh/resource-policy: keep
{{- if $consoleManaged }}
    wandb.ai/console-managed: "true"
{{- end }}
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
