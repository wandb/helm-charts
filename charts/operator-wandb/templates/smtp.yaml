{{- $email := .Values.global.email | default dict -}}
{{- $smtp := $email.smtp | default dict -}}
{{- $name := include "wandb.smtp.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict -}}
{{- $metadata := $existing.metadata | default dict -}}
{{- $annotations := $metadata.annotations | default dict -}}
{{- $consoleManaged := eq (get $annotations "wandb.ai/console-managed") "true" -}}
{{- $data := dict -}}
{{- if $consoleManaged -}}
  {{- $data = $existing.data | default dict -}}
{{- else -}}
  {{- $host := include "wandb.smtp.inlineValue" $smtp.host -}}
  {{- $port := include "wandb.smtp.inlineValue" ($smtp.port | default 587) -}}
  {{- $user := include "wandb.smtp.inlineValue" $smtp.user -}}
  {{- $password := include "wandb.smtp.inlineValue" $smtp.password -}}
  {{- $mailFrom := include "wandb.smtp.inlineValue" $smtp.mailFrom -}}

  {{- /* Store inline fields here; external fields keep their pod valueFrom references. */ -}}
  {{- if not (include "wandb.smtp.isExternal" $smtp.host) -}}
    {{- $_ := set $data "SMTP_HOST" ($host | b64enc) -}}
  {{- end -}}
  {{- if not (include "wandb.smtp.isExternal" $smtp.port) -}}
    {{- $_ := set $data "SMTP_PORT" ($port | b64enc) -}}
  {{- end -}}
  {{- if not (include "wandb.smtp.isExternal" $smtp.user) -}}
    {{- $_ := set $data "SMTP_USER" ($user | b64enc) -}}
  {{- end -}}
  {{- if not (include "wandb.smtp.isExternal" $smtp.password) -}}
    {{- $_ := set $data "SMTP_PASSWORD" ($password | b64enc) -}}
  {{- end -}}
  {{- if and $mailFrom (not (include "wandb.smtp.isExternal" $smtp.mailFrom)) -}}
    {{- $_ := set $data "GORILLA_EMAIL_FROM_ADDRESS" ($mailFrom | b64enc) -}}
  {{- end -}}

  {{- /* All-inline settings can store a complete URL. Secret values are not expanded
    by Kubernetes, so URLs with external fields are assembled in wandb.smtpEnvs.
  */ -}}
  {{- if not (include "wandb.smtp.hasConnectionRefs" .) -}}
    {{- $sink := "https://api.wandb.ai/email/dispatch" -}}
    {{- if $host -}}
      {{- $sink = printf "smtp://%s:%s@%s:%s" $user $password $host $port -}}
    {{- end -}}
    {{- $_ := set $data "GORILLA_EMAIL_SINK" ($sink | b64enc) -}}
  {{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  annotations:
    helm.sh/resource-policy: keep
{{- if $consoleManaged }}
    wandb.ai/console-managed: "true"
{{- end }}
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
