{{- $slack := .Values.global.slack | default dict -}}
{{- $secret := $slack.slackSecret | default dict -}}
{{- if not $secret.name -}}
  {{- $name := include "wandb.slack.secretName" . -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict -}}
  {{- $metadata := get $existing "metadata" | default dict -}}
  {{- $annotations := get $metadata "annotations" | default dict -}}
  {{- $consoleManaged := eq (get $annotations "wandb.ai/console-managed") "true" -}}
  {{- $data := dict -}}
  {{- if $consoleManaged -}}
    {{- /* Keep intentional removals; never restore inline credentials after Console takes ownership. */ -}}
    {{- $data = get $existing "data" | default dict -}}
  {{- else -}}
    {{- if $slack.clientId -}}
      {{- $_ := set $data "GORILLA_SLACK_CLIENT_ID" ($slack.clientId | toString | b64enc) -}}
      {{- $_ := set $data "SLACK_CLIENT_ID" ($slack.clientId | toString | b64enc) -}}
    {{- end -}}
    {{- if $slack.secret -}}
      {{- $_ := set $data "GORILLA_SLACK_SECRET" ($slack.secret | toString | b64enc) -}}
      {{- $_ := set $data "SLACK_SECRET" ($slack.secret | toString | b64enc) -}}
    {{- end -}}
  {{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    "helm.sh/resource-policy": "keep"
  {{- if $consoleManaged }}
    "wandb.ai/console-managed": "true"
  {{- end }}
  labels:
    {{- include "wandb.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{- $data | toYaml | nindent 2 }}
{{- end }}
