{{- $alertWorkerEnabled := index .Values "weave-trace-alert-worker" "install" -}}
{{- if $alertWorkerEnabled -}}
  {{- if not (index .Values "weave-trace" "install") -}}
    {{- fail "weave-trace-alert-worker.install requires weave-trace.install=true" -}}
  {{- end -}}
  {{- if not (or .Values.kafka.install .Values.bufstream.install .Values.global.kafka.brokerHost) -}}
    {{- fail "weave-trace-alert-worker.install requires Kafka/Bufstream installation or global.kafka.brokerHost" -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-weave-trace-configmap
  annotations:
    "reflector.v1.k8s.emberstack.com/reflection-allowed": "true"
    "reflector.v1.k8s.emberstack.com/reflection-auto-enabled": "true"
    "reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces": "{{ .Release.Name }}-weave-trace"
  labels:
      {{- include "wandb.commonLabels" . | nindent 4 }}
data:
  PORT: "8080"
  API_PATH_PREFIX: "/traces"
  WANDB_PUBLIC_BASE_URL: {{ .Values.global.host | quote }}
{{- if .Values.global.api.enabled }}
  WANDB_BASE_URL: "http://{{ .Release.Name }}-api:8081/"
{{- else }}
  WANDB_BASE_URL: "http://{{ .Release.Name }}-app:8080/"
{{- end }}
  WF_TRACE_SERVER_URL: "{{ .Values.global.host }}/traces"
  WF_ENFORCE_PASSWORD_LENGTH: "false"
{{- /* Both consumers need finished-call events, even when scoring is disabled. */}}
  WEAVE_ENABLE_ONLINE_EVAL: {{ or (index .Values "weave-trace-worker" "install") (index .Values "weave-trace-alert-worker" "install") | quote }}
  WEAVE_ENABLE_EVALUATE_MODEL_WORKER: {{ (get  .Values "weave-evaluate-model-worker").install | quote }}
  WEAVE_ENABLE_AGENT_SCORING: {{ (get  .Values "weave-trace-agent-scoring-worker").install | quote }}
  WEAVE_TRACE_SERVER_BASE_URL: "{{ .Values.global.host }}/traces"
  WANDB_INTERNAL_SERVICE_TOKEN_SECRET_NAME: "weave-worker-auth"
  KAFKA_BROKER_HOST: "{{ include "wandb.kafka.brokerHost" . }}"
  KAFKA_BROKER_PORT: "{{ include "wandb.kafka.brokerPort" . }}"
  WEAVE_REDIS_URL: "{{ include "wandb.redis.connectionString" . | trim }}"
{{- $fileStorageURI := include "wandb.weaveTraceFileStorageURI" . }}
{{- if $fileStorageURI }}
  WF_FILE_STORAGE_URI: {{ $fileStorageURI | quote }}
{{- end }}
