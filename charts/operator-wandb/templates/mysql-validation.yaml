{{- range $key := list "rdsIamAuth" "azureEntraAuth" -}}
  {{- if not (kindIs "bool" (get $.Values.global.mysql $key)) -}}
    {{- fail (printf "global.mysql.%s must be a boolean" $key) -}}
  {{- end -}}
{{- end -}}

{{- $cloudSqlProxy := .Values.global.mysql.cloudSqlProxy -}}
{{- if not (kindIs "bool" $cloudSqlProxy.enabled) -}}
  {{- fail "global.mysql.cloudSqlProxy.enabled must be a boolean" -}}
{{- end -}}

{{- $passwordlessKeys := list -}}
{{- if .Values.global.mysql.rdsIamAuth -}}
  {{- $passwordlessKeys = append $passwordlessKeys "rdsIamAuth" -}}
{{- end -}}
{{- if .Values.global.mysql.azureEntraAuth -}}
  {{- $passwordlessKeys = append $passwordlessKeys "azureEntraAuth" -}}
{{- end -}}
{{- if $cloudSqlProxy.enabled -}}
  {{- $passwordlessKeys = append $passwordlessKeys "cloudSqlProxy.enabled" -}}
{{- end -}}
{{- if gt (len $passwordlessKeys) 1 -}}
  {{- fail (printf "only one of global.mysql.rdsIamAuth, global.mysql.azureEntraAuth and global.mysql.cloudSqlProxy.enabled can be true; got %s" (join ", " $passwordlessKeys)) -}}
{{- end -}}

{{- if $passwordlessKeys -}}
  {{- $when := printf "when global.mysql.%s=true" (first $passwordlessKeys) -}}
  {{- if not .Values.global.mysql.fromSecret -}}
    {{- /* The proxy dials Cloud SQL by instance connection name, not host. */ -}}
    {{- if and (empty .Values.global.mysql.host) (not $cloudSqlProxy.enabled) -}}
      {{- fail (printf "global.mysql.host is required %s" $when) -}}
    {{- end -}}
    {{- if empty .Values.global.mysql.user -}}
      {{- fail (printf "global.mysql.user is required %s" $when) -}}
    {{- end -}}
  {{- end -}}
  {{- if and $cloudSqlProxy.enabled (empty $cloudSqlProxy.instanceConnectionName) -}}
    {{- fail (printf "global.mysql.cloudSqlProxy.instanceConnectionName is required %s" $when) -}}
  {{- end -}}
  {{- if .Values.global.mysql.rdsIamAuth -}}
    {{- if empty .Values.global.mysql.awsRegion -}}
      {{- fail (printf "global.mysql.awsRegion is required %s" $when) -}}
    {{- end -}}
    {{- if empty .Values.global.mysql.caCert -}}
      {{- fail (printf "global.mysql.caCert is required %s" $when) -}}
    {{- end -}}
  {{- end -}}
  {{- if not (empty .Values.global.mysql.password) -}}
    {{- fail (printf "global.mysql.password must be empty %s" $when) -}}
  {{- end -}}
  {{- if not (empty .Values.global.mysql.passwordSecret.name) -}}
    {{- fail (printf "global.mysql.passwordSecret.name must be empty %s" $when) -}}
  {{- end -}}
  {{- if .Values.mysql.install -}}
    {{- fail (printf "mysql.install must be false %s" $when) -}}
  {{- end -}}
  {{- if and .Values.app.install (index .Values.app.initContainers "init-db").enabled -}}
    {{- fail (printf "app.initContainers.init-db.enabled must be false %s" $when) -}}
  {{- end -}}
  {{- if and .Values.prometheus.install (index .Values.prometheus "mysql-exporter").install -}}
    {{- fail (printf "prometheus.mysql-exporter.install must be false %s" $when) -}}
  {{- end -}}
{{- end -}}
