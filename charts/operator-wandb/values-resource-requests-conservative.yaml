parquet:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - parquet
            - parquet-metadata-cache
  sizing:
    medium:
      resources:
        requests:
          cpu: "8"
          memory: 64Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    # Compaction candidates; retain memory for observed working-set peaks.
    large:
      resources:
        requests:
          cpu: "8"
          memory: 64Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    xlarge:
      resources:
        requests:
          cpu: "12"
          memory: 64Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
parquet-metadata-cache:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - parquet
            - parquet-metadata-cache
  sizing:
    medium:
      resources:
        requests:
          cpu: "8"
          memory: 64Gi
    # Experimental: warm-cache load tests must validate the lower reservation.
    # Limits and the runtime memory budget remain 64Gi.
    large:
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
    xlarge:
      resources:
        requests:
          cpu: "8"
          memory: 32Gi
