# Optional request profile, informed by 30 days of managed-install telemetry.
# CPU requests use 0.25-core steps; limits and replica bounds stay unchanged.
# Percentage HPA targets intentionally scale against these new requests.
# Candidates require load validation. See docs/resource-requests.md and
# docs/resource-requests-evidence.md for coverage, pressure and retained defaults.
app:
  sizing:
    small:
      resources:
        requests:
          cpu: "0.5"
          memory: 2Gi
    medium:
      resources:
        requests:
          cpu: "0.5"
          memory: 2Gi
    large:
      resources:
        requests:
          cpu: "0.5"
          memory: 2Gi
api:
  sizing:
    medium:
      resources:
        requests:
          cpu: "4"
          memory: 12Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    large:
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
