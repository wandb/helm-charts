          memory: 16Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    xlarge:
      resources:
        requests:
          cpu: "6"
          memory: 16Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    xxlarge:
      resources:
        requests:
          cpu: "6"
          memory: 16Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
