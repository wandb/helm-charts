# Optional resource request profile; validate against your workload before use.
# CPU requests use 0.25-core steps; limits and replica bounds stay unchanged.
# Percentage HPA targets intentionally scale against these new requests.
# See docs/resource-requests.md for configuration and validation requirements.
app:
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: "wandb-ca-certs-root,datadog-socket"
  podDisruptionBudget:
    # These services can be singletons. Opt into eviction only after ensuring redundancy.
    maxUnavailable: "0%"
  sizing:
    small:
      resources:
        requests:
          cpu: "0.5"
          memory: 2Gi
    medium:
      resources:
        requests:
          cpu: "0.5"
          memory: 2Gi
    large:
      resources:
        requests:
          cpu: "0.5"
          memory: 2Gi
    # Legacy app is optional. Larger tiers retain chart defaults.
    xlarge:
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
    xxlarge:
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
api:
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: "wandb-ca-certs-root,datadog-socket,temp-dir"
  sizing:
    # Small and xlarge/xxlarge retain chart defaults.
    small:
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    medium:
      resources:
        requests:
          cpu: "4"
          memory: 12Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    large:
