parquet:
  podAnnotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict-local-volumes: "wandb-ca-certs-root,datadog-socket"
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - parquet
            - parquet-metadata-cache
  sizing:
    # Small and xxlarge retain chart defaults.
    small:
      resources:
        requests:
          cpu: "1"
          memory: 8Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    medium:
      resources:
        requests:
          cpu: "8"
          memory: 64Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    # Lower CPU requests; memory requests remain unchanged.
    large:
      resources:
        requests:
          cpu: "8"
          memory: 64Gi
      autoscaling:
        horizontal:
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 80
    xlarge:
