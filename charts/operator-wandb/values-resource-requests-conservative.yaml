parquet:
  # Separate both Parquet services across hostnames within the namespace.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [parquet, parquet-metadata-cache]
  sizing:
    medium:
      resources:
        requests:
          cpu: "8"
      autoscaling:
        horizontal:
          targetCPUAverageValue: "12"
        keda:
          resourceRequestBaseline:
            cpuMillicores: 15000
