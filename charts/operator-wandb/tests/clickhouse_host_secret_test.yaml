suite: Legacy ClickHouse host Secret
templates:
  - charts/weave-trace/templates/deployment.yaml
values:
  - fixtures/weave_trace_olap.yaml
release:
  name: wandb
  namespace: default

tests:
  - it: keeps the default host and port when no host Secret is configured
    template: charts/weave-trace/templates/deployment.yaml
    set:
      global.weaveTrace.clickhouseSource: legacy
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            value: wandb-clickhouse-headless
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_PORT
            value: "8123"

  - it: keeps a custom inline host ahead of the host Secret
    template: charts/weave-trace/templates/deployment.yaml
    set:
      global.weaveTrace.clickhouseSource: legacy
      global.clickhouse.host: custom-clickhouse.example.com
      global.clickhouse.hostSecret.name: managed-clickhouse
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            value: custom-clickhouse.example.com
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            valueFrom:
              secretKeyRef:
                name: managed-clickhouse
                key: host
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_PORT
            value: "8443"

  - it: reads the default host from the Secret and defaults to the cloud port
    template: charts/weave-trace/templates/deployment.yaml
    set:
      global.weaveTrace.clickhouseSource: legacy
      global.clickhouse.hostSecret:
        name: managed-clickhouse
        hostKey: endpoint
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            valueFrom:
              secretKeyRef:
                name: managed-clickhouse
                key: endpoint
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_PORT
            value: "8443"

  - it: reads an empty inline host from the Secret
    template: charts/weave-trace/templates/deployment.yaml
    set:
      global.weaveTrace.clickhouseSource: legacy
      global.clickhouse.host: ""
      global.clickhouse.hostSecret.name: managed-clickhouse
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            valueFrom:
              secretKeyRef:
                name: managed-clickhouse
                key: host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_PORT
            value: "8443"

  - it: preserves an explicitly configured port with a host Secret
    template: charts/weave-trace/templates/deployment.yaml
    set:
      global.weaveTrace.clickhouseSource: legacy
      global.clickhouse.hostSecret.name: managed-clickhouse
      global.clickhouse.port: "9000"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_PORT
            value: "9000"

  - it: preserves a host valueFrom map ahead of the host Secret
    template: charts/weave-trace/templates/deployment.yaml
    set:
      global.weaveTrace.clickhouseSource: legacy
      global.clickhouse.host:
        valueFrom:
          configMapKeyRef:
            name: existing-clickhouse
            key: endpoint
      global.clickhouse.hostSecret.name: managed-clickhouse
      global.clickhouse.port: "8443"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            valueFrom:
              configMapKeyRef:
                name: existing-clickhouse
                key: endpoint
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            valueFrom:
              secretKeyRef:
                name: managed-clickhouse
                key: host
          any: true

  - it: selects an enabled OLAP profile when hostSecret is unset
    template: charts/weave-trace/templates/deployment.yaml
    set:
      global.weaveTrace.clickhouseSource: auto
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            value: managed-clickhouse.example.com

  - it: treats hostSecret as legacy enrollment when source selection is automatic
    template: charts/weave-trace/templates/deployment.yaml
    set:
      global.weaveTrace.clickhouseSource: auto
      global.clickhouse.hostSecret.name: managed-clickhouse
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_HOST
            valueFrom:
              secretKeyRef:
                name: managed-clickhouse
                key: host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WF_CLICKHOUSE_PORT
            value: "8443"
