suite: OIDC Secret lookup
templates:
  - oidc.yaml
  - charts/api/templates/deployment.yaml
release:
  name: customer
  namespace: dedicated
set:
  app.internalJWTMap: null
  global.api.enabled: true
  global.auth.oidc.oidcConfigMap.name: external-oidc
  global.auth.oidc.secret: inline-secret
kubernetesProvider:
  scheme:
    v1/Secret:
      gvr:
        version: v1
        resource: secrets
      namespaced: true
tests:
  - it: seeds a missing Secret from the inline value
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: customer-oidc-secret
      - equal:
          path: data
          value:
            OIDC_SECRET: aW5saW5lLXNlY3JldA==
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - notExists:
          path: metadata.annotations["wandb.ai/console-managed"]
    template: oidc.yaml
  - it: continues applying inline values before Console owns the Secret
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
          data:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
    asserts:
      - equal:
          path: data
          value:
            OIDC_SECRET: aW5saW5lLXNlY3JldA==
      - notExists:
          path: metadata.annotations["wandb.ai/console-managed"]
    template: oidc.yaml
  - it: preserves Console data without encoding it twice
    release:
      isUpgrade: true
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
            resourceVersion: '123'
          data:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
            EXTRA: dmFsdWU=
    asserts:
      - equal:
          path: data
          value:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
            EXTRA: dmFsdWU=
      - equal:
          path: metadata.annotations["wandb.ai/console-managed"]
          value: 'true'
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - notExists:
          path: metadata.resourceVersion
    template: oidc.yaml
  - it: retains a Console-managed Secret after removing the inline value
    set:
      global.auth.oidc.secret: ''
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
          data:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.OIDC_SECRET
          value: Y29uc29sZS1zZWNyZXQ=
    template: oidc.yaml
  - it: preserves empty data instead of restoring the inline credential
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
          data: {}
    asserts:
      - equal:
          path: data
          value: {}
    template: oidc.yaml
  - it: treats absent data as intentionally empty
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
    asserts:
      - equal:
          path: data
          value: {}
    template: oidc.yaml
  - it: returns to inline data when the ownership marker is false
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'false'
          data:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
    asserts:
      - equal:
          path: data
          value:
            OIDC_SECRET: aW5saW5lLXNlY3JldA==
      - notExists:
          path: metadata.annotations["wandb.ai/console-managed"]
    template: oidc.yaml
  - it: does not render an externally managed Secret
    set:
      global.auth.oidc.oidcSecret.name: customer-oidc-secret
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
          data:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
    asserts:
      - hasDocuments:
          count: 0
    template: oidc.yaml
  - it: does not reuse Secrets from a different release or namespace
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: other
            annotations:
              wandb.ai/console-managed: 'true'
          data:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
        - apiVersion: v1
          kind: Secret
          metadata:
            name: other-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
          data:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
    asserts:
      - equal:
          path: data
          value:
            OIDC_SECRET: aW5saW5lLXNlY3JldA==
      - notExists:
          path: metadata.annotations["wandb.ai/console-managed"]
    template: oidc.yaml
  - it: keeps the existing custom Secret key contract
    set:
      global.auth.oidc.oidcSecret.secretKey: client-secret
    asserts:
      - equal:
          path: data
          value:
            client-secret: aW5saW5lLXNlY3JldA==
    template: oidc.yaml
  - it: creates an empty Secret for Console to patch when no credential exists
    set:
      global.auth.oidc.secret: ''
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: customer-oidc-secret
      - equal:
          path: data
          value: {}
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - notExists:
          path: metadata.annotations["wandb.ai/console-managed"]
    template: oidc.yaml
  - it: uses Console-managed credentials after removing the inline value
    template: charts/api/templates/deployment.yaml
    set:
      global.auth.oidc.secret: ''
      global.auth.oidc.oidcSecret.secretKey: OIDC_SECRET
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
          data:
            OIDC_SECRET: Y29uc29sZS1zZWNyZXQ=
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: customer-oidc-secret
                key: OIDC_SECRET
  - it: keeps references to a Console-managed custom key
    template: charts/api/templates/deployment.yaml
    set:
      global.auth.oidc.secret: ''
      global.auth.oidc.oidcSecret.secretKey: client-secret
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
          data:
            client-secret: Y29uc29sZS1zZWNyZXQ=
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: customer-oidc-secret
                key: client-secret
  - it: omits Secret references after Console clears the credential
    template: charts/api/templates/deployment.yaml
    set:
      global.auth.oidc.secret: inline-secret
      global.auth.oidc.oidcSecret.secretKey: OIDC_SECRET
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
          data: {}
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_SECRET
          any: true
  - it: omits Secret references when Console stores an empty credential
    template: charts/api/templates/deployment.yaml
    set:
      global.auth.oidc.secret: inline-secret
      global.auth.oidc.oidcSecret.secretKey: OIDC_SECRET
    kubernetesProvider:
      objects:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: customer-oidc-secret
            namespace: dedicated
            annotations:
              wandb.ai/console-managed: 'true'
          data:
            OIDC_SECRET: ''
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_SECRET
          any: true
