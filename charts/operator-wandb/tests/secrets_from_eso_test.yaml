suite: Datastore settings from ESO Secrets
templates:
  - charts/api/templates/deployment.yaml
  - templates/mysql.yaml
  - templates/mysql-validation.yaml
release:
  name: wandb
  namespace: default
values:
  - ../../../test-configs/operator-wandb/secrets-from-eso.yaml
tests:
  - it: reads mysql settings from global.mysql.fromSecret
    template: charts/api/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: managed-spec-mysql
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_HOST
            valueFrom:
              secretKeyRef:
                name: managed-spec-mysql
                key: host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_USER
            valueFrom:
              secretKeyRef:
                name: managed-spec-mysql
                key: user
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_HOST
            value: inline-mysql-host

  - it: skips the chart-owned mysql password Secret
    template: templates/mysql.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: reads redis host, port and password from global.redis.fromSecret
    template: charts/api/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: managed-spec-redis
                key: password
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
            valueFrom:
              secretKeyRef:
                name: managed-spec-redis
                key: host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PORT
            valueFrom:
              secretKeyRef:
                name: managed-spec-redis
                key: port
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS
            value: redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)$(REDIS_PARAMS)

  - it: adds global.envFrom Secrets to every container
    template: charts/api/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: managed-spec-server-env
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: managed-spec-custom-env

  - it: keeps the password Secret and inline redis host when fromSecret is unset
    template: charts/api/templates/deployment.yaml
    set:
      global.mysql.fromSecret: ""
      global.redis.fromSecret: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_HOST
            value: inline-mysql-host
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: wandb-mysql
                key: MYSQL_PASSWORD
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_HOST
          any: true

  - it: allows IAM auth without inline host and user when fromSecret is set
    template: templates/mysql-validation.yaml
    set:
      global.mysql.host: ""
      global.mysql.password: ""
      global.mysql.user: ""
      global.mysql.rdsIamAuth: true
      global.mysql.awsRegion: us-east-1
      global.mysql.caCert: test-ca
      app.initContainers.init-db.enabled: false
      prometheus.mysql-exporter.install: false
    asserts:
      - notFailedTemplate: {}

  - it: still requires inline host for IAM auth without fromSecret
    template: templates/mysql-validation.yaml
    set:
      global.mysql.fromSecret: ""
      global.mysql.host: ""
      global.mysql.password: ""
      global.mysql.rdsIamAuth: true
      global.mysql.awsRegion: us-east-1
      global.mysql.caCert: test-ca
      app.initContainers.init-db.enabled: false
      prometheus.mysql-exporter.install: false
    asserts:
      - failedTemplate:
          errorMessage: global.mysql.host is required when global.mysql.rdsIamAuth=true
