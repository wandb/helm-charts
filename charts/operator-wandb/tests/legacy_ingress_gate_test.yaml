---
suite: legacy_ingress_gate
templates:
- templates/ingress.yaml
tests:
- it: legacy=False install=False create=False secondary=False
  set:
    global.legacyIngress: false
    ingress.install: false
    ingress.create: false
    ingress.secondary.create: false
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=False install=False create=False secondary=True
  set:
    global.legacyIngress: false
    ingress.install: false
    ingress.create: false
    ingress.secondary.create: true
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=False install=False create=True secondary=False
  set:
    global.legacyIngress: false
    ingress.install: false
    ingress.create: true
    ingress.secondary.create: false
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=False install=False create=True secondary=True
  set:
    global.legacyIngress: false
    ingress.install: false
    ingress.create: true
    ingress.secondary.create: true
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=False install=True create=False secondary=False
  set:
    global.legacyIngress: false
    ingress.install: true
    ingress.create: false
    ingress.secondary.create: false
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=False install=True create=False secondary=True
  set:
    global.legacyIngress: false
    ingress.install: true
    ingress.create: false
    ingress.secondary.create: true
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=False install=True create=True secondary=False
  set:
    global.legacyIngress: false
    ingress.install: true
    ingress.create: true
    ingress.secondary.create: false
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=False install=True create=True secondary=True
  set:
    global.legacyIngress: false
    ingress.install: true
    ingress.create: true
    ingress.secondary.create: true
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=True install=False create=False secondary=False
  set:
    global.legacyIngress: true
    ingress.install: false
    ingress.create: false
    ingress.secondary.create: false
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=True install=False create=False secondary=True
  set:
    global.legacyIngress: true
    ingress.install: false
    ingress.create: false
    ingress.secondary.create: true
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 1
- it: legacy=True install=False create=True secondary=False
  set:
    global.legacyIngress: true
    ingress.install: false
    ingress.create: true
    ingress.secondary.create: false
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=True install=False create=True secondary=True
  set:
    global.legacyIngress: true
    ingress.install: false
    ingress.create: true
    ingress.secondary.create: true
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 1
- it: legacy=True install=True create=False secondary=False
  set:
    global.legacyIngress: true
    ingress.install: true
    ingress.create: false
    ingress.secondary.create: false
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 0
- it: legacy=True install=True create=False secondary=True
  set:
    global.legacyIngress: true
    ingress.install: true
    ingress.create: false
    ingress.secondary.create: true
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 1
- it: legacy=True install=True create=True secondary=False
  set:
    global.legacyIngress: true
    ingress.install: true
    ingress.create: true
    ingress.secondary.create: false
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 1
- it: legacy=True install=True create=True secondary=True
  set:
    global.legacyIngress: true
    ingress.install: true
    ingress.create: true
    ingress.secondary.create: true
    ingress.secondary.nameOverride: secondary
    ingress.issuer.create: false
  asserts:
  - hasDocuments:
      count: 2
- it: retains ManagedCertificate with both ingress gates off
  set:
    global.legacyIngress: false
    ingress.issuer.create: true
    ingress.issuer.provider: google
    ingress.secondary.create: true
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: ManagedCertificate
- it: retains Issuer with both ingress gates off
  set:
    global.legacyIngress: false
    ingress.issuer.create: true
    ingress.issuer.provider: letsencrypt
    ingress.secondary.create: true
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: Issuer
- it: keeps legacy resources absent with Traefik enabled
  set:
    global.legacyIngress: false
    global.traefikIngress: true
    global.ipAllowList.enabled: true
    global.ipAllowList.userCIDRs:
    - 192.0.2.0/24
  asserts:
  - hasDocuments:
      count: 0
