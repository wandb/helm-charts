                  number: 8080
          - pathType: Prefix
            path: "/console"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
- it: shares trace route paths with the primary ingress
  set:
    weave-trace.install: true
  asserts:
  - equal:
      path: spec.rules
      value:
      - host: customer.example.com
        http:
          paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: customer-app
                port:
                  number: 8080
          - pathType: Prefix
            path: "/console"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
          - pathType: Prefix
            path: "/traces"
            backend:
              service:
                name: customer-weave-trace
                port:
                  number: 8722
      - host: alias.example.com
        http:
