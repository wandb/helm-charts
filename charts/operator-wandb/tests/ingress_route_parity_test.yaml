- it: shares MCP custom Service paths with the primary ingress
  set:
    mcp-server.install: true
    mcp-server.service.name: customer-mcp-custom
    mcp-server.service.ports:
    - name: http
      port: 9090
      targetPort: 8080
  asserts:
  - equal:
      path: spec.rules
      value:
      - host: customer.example.com
        http:
          paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: customer-app
                port:
                  number: 8080
          - pathType: Prefix
            path: "/mcp"
            backend:
              service:
                name: customer-mcp-custom
                port:
                  number: 9090
          - pathType: Prefix
            path: "/console"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
      - host: alias.example.com
