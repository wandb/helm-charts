---
suite: Primary and Traefik route parity
templates:
- templates/ingress.yaml
- templates/traefik-ingress.yaml
release:
  name: customer
  namespace: customer-ns
set:
  global.host: https://customer.example.com
  global.traefikIngress: true
  global.ipAllowList.enabled: true
  global.ipAllowList.userCIDRs:
  - 192.0.2.0/24
  ingress.additionalHosts:
  - alias.example.com
tests:
- it: shares monolith paths with the primary ingress
  set: {}
  asserts:
  - equal:
      path: spec.rules
      value:
      - host: customer.example.com
        http:
          paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: customer-app
                port:
                  number: 8080
          - pathType: Prefix
            path: "/console"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
      - host: alias.example.com
        http:
          paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: customer-app
                port:
                  number: 8080
          - pathType: Prefix
            path: "/console"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
- it: shares console default backend paths with the primary ingress
  set:
    ingress.defaultBackend: console
  asserts:
  - equal:
      path: spec.rules
      value:
      - host: customer.example.com
        http:
          paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
          - pathType: Prefix
            path: "/console"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
      - host: alias.example.com
        http:
          paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
          - pathType: Prefix
            path: "/console"
            backend:
              service:
                name: customer-console
                port:
                  number: 8082
- it: shares frontend default backend paths with the primary ingress
  set:
    frontend.install: true
  asserts:
  - equal:
      path: spec.rules
      value:
      - host: customer.example.com
        http:
          paths:
          - pathType: Prefix
            path: "/"
            backend:
