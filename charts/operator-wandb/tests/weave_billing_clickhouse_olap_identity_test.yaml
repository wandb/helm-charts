suite: Weave billing ClickHouse OLAP identity
templates:
  - charts/glue/templates/deployment.yaml
values:
  - fixtures/weave_trace_olap.yaml
set:
  global.glue.enabled: true
  global.olap.default.host: managed-clickhouse.example.com
  global.olap.weaveBilling.enabled: true
release:
  name: wandb
  namespace: default

tests:
  - it: leaves billing unset rather than inherit the default identity
    template: charts/glue/templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: WEAVE_BILLING_USER
          any: true

  - it: leaves billing unset without a dedicated password
    template: charts/glue/templates/deployment.yaml
    set:
      global.olap.weaveBilling.user:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: username
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          any: true

  - it: leaves billing unset without a dedicated user
    template: charts/glue/templates/deployment.yaml
    set:
      global.olap.weaveBilling.password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: password
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          any: true

  - it: does not fall back to the legacy billing Secret in glue when the OLAP identity is incomplete
    template: charts/glue/templates/deployment.yaml
    set:
      global.weaveBillingClickhouse.secretName: managed-spec-clickhouse-legacy
      global.olap.weaveBilling.user:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: username
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
          any: true

  - it: does not use the legacy billing Secret when Weave Trace resolves to OLAP without billing
    template: charts/glue/templates/deployment.yaml
    set:
      global.olap.weaveBilling.enabled: false
      global.weaveBillingClickhouse.secretName: managed-spec-clickhouse-legacy
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          any: true
