# A read-only billing identity for an install whose Weave Trace uses OLAP.
global:
  olap:
    default:
      host: managed-clickhouse.example.com
    weaveBilling:
      enabled: true
      user:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: username
      password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: password
