# A read-only billing identity for an install whose Weave Trace uses OLAP.
global:
  weaveBillingClickhouse:
    olap:
      enabled: true
      user:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: username
      password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave-billing
            key: password
