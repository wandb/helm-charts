# A connection profile provisioned before an SA enables Weave's OLAP connection.
weave-trace:
  install: true
weave-trace-worker:
  install: true
weave-evaluate-model-worker:
  install: true
weave-trace-agent-scoring-worker:
  install: true
global:
  olap:
    default:
      user:
        valueFrom:
          configMapKeyRef:
            name: clickhouse-olap
            key: user
      password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-olap-password
            key: password
    weaveTrace:
      enabled: true
      host: managed-clickhouse.example.com
      user:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave
            key: username
      password:
        valueFrom:
          secretKeyRef:
            name: clickhouse-weave
            key: password
      migrator:
        enabled: true
        user:
          valueFrom:
            secretKeyRef:
              name: clickhouse-weave-migrator
              key: username
        password:
          valueFrom:
            secretKeyRef:
              name: clickhouse-weave-migrator
              key: password
