global:
  defaultBucket:
    provider: az
    name: deployment-storage
    path: wandb
    azureAuthMethod: workloadIdentity
  azureStorageIdentity:
    tenantId: deployment-tenant
    clientId: deployment-client
    serviceAccount:
      mode: consolidated
  bucket:
    provider: az
    name: customer-storage
    path: customer-container/prefix
    azureTenantId: customer-tenant
    azureClientId: customer-client
