suite: Weave billing ClickHouse Secret
templates:
  - charts/api/templates/deployment.yaml
  - charts/glue/templates/deployment.yaml
  - charts/app/templates/deployment.yaml
set:
  global.api.enabled: true
  global.glue.enabled: true
release:
  name: wandb
  namespace: default

tests:
  - it: does not add billing env vars to glue without a Secret name
    template: charts/glue/templates/deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
          any: true

  - it: reads both billing values from configured Secret keys in glue
    template: charts/glue/templates/deployment.yaml
    set:
      global.weaveBillingClickhouse:
        secretName: weave-billing
        addressKey: clickhouse-address
        secretKey: clickhouse-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
            valueFrom:
              secretKeyRef:
                name: weave-billing
                key: clickhouse-address
                optional: true
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
            valueFrom:
              secretKeyRef:
                name: weave-billing
                key: clickhouse-secret
                optional: true
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
          count: 1
          any: true

  - it: lets explicit billing env values override Secret references in glue
    template: charts/glue/templates/deployment.yaml
    set:
      global.weaveBillingClickhouse.secretName: weave-billing
      global.extraEnv:
        GORILLA_WEAVE_CLICKHOUSE_ADDRESS: inline-address
        GORILLA_WEAVE_CLICKHOUSE_SECRET: inline-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
            value: inline-address
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
            value: inline-secret
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
          count: 1
          any: true

  - it: falls back to the Secret for only the billing secret env in glue
    template: charts/glue/templates/deployment.yaml
    set:
      global.weaveBillingClickhouse.secretName: weave-billing
      global.extraEnv:
        GORILLA_WEAVE_CLICKHOUSE_ADDRESS: inline-address
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
            value: inline-address
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
            valueFrom:
              secretKeyRef:
                name: weave-billing
                key: secret
                optional: true
          count: 1
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
          count: 1
          any: true

  - it: keeps the billing Secret off api, which never reads it
    template: charts/api/templates/deployment.yaml
    set:
      global.weaveBillingClickhouse.secretName: weave-billing
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
          any: true

  - it: does not add billing env vars to an unrelated app deployment
    template: charts/app/templates/deployment.yaml
    set:
      global.weaveBillingClickhouse.secretName: weave-billing
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_ADDRESS
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_WEAVE_CLICKHOUSE_SECRET
          any: true
