suite: frontend runtime environment
templates:
  - templates/frontend.yaml
release:
  name: wandb
  namespace: default

tests:
  - it: patches env.js in the writable runtime directory with an older-image fallback
    template: templates/frontend.yaml
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data["02_patch_env_js.sh"]
          pattern: 'BUILD_DIR="\${FRONTEND_RUNTIME_BUILD_DIR:-\$BUILD_DIR}"'
