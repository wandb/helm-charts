suite: external OIDC environment
templates:
  - charts/app/templates/deployment.yaml
  - charts/api/templates/deployment.yaml
release:
  name: wandb
set:
  global.api.enabled: true
  global.auth.oidc.oidcConfigMap.name: customer-oidc
  global.auth.oidc.oidcSecret.name: customer-oidc-secret
tests:
  - it: reads external OIDC settings and credentials in app
    template: charts/app/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_CLIENT_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_CLIENT_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_ISSUER
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_ISSUER
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_AUTH_METHOD
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_AUTH_METHOD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTH_METHOD
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_AUTH_METHOD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_CORS_ORIGINS
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: GORILLA_CORS_ORIGINS
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: customer-oidc-secret
                key: OIDC_SECRET
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: customer-oidc-secret
                key: OIDC_SECRET
  - it: reads external OIDC settings and credentials in api
    template: charts/api/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_CLIENT_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_CLIENT_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_ISSUER
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_ISSUER
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_AUTH_METHOD
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_AUTH_METHOD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTH_METHOD
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_AUTH_METHOD
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_CORS_ORIGINS
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: GORILLA_CORS_ORIGINS
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: customer-oidc-secret
                key: OIDC_SECRET
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: customer-oidc-secret
                key: OIDC_SECRET
  - it: supports custom ConfigMap and Secret keys
    template: charts/api/templates/deployment.yaml
    set:
      global.auth.oidc.oidcConfigMap.clientIdKey: client-id
      global.auth.oidc.oidcConfigMap.issuerKey: issuer
      global.auth.oidc.oidcConfigMap.authMethodKey: auth-method
      global.auth.oidc.oidcConfigMap.corsOriginsKey: cors-origins
      global.auth.oidc.oidcSecret.secretKey: client-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: client-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: client-id
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: issuer
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: issuer
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_AUTH_METHOD
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: auth-method
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTH_METHOD
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: auth-method
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_CORS_ORIGINS
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: cors-origins
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: customer-oidc-secret
                key: client-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: customer-oidc-secret
                key: client-secret
  - it: supports external configuration without a client secret
    template: charts/app/templates/deployment.yaml
    set:
      global.auth.oidc.oidcSecret.name: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                name: customer-oidc
                key: OIDC_CLIENT_ID
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_SECRET
          any: true
  - it: keeps inline secret references without opting into external configuration
    template: charts/app/templates/deployment.yaml
    set:
      global.auth.oidc.oidcConfigMap.name: ""
      global.auth.oidc.oidcSecret.name: ""
      global.auth.oidc.secret: legacy-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: wandb-oidc-secret
                key: OIDC_SECRET
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_SECRET
            valueFrom:
              secretKeyRef:
                name: wandb-oidc-secret
                key: OIDC_SECRET
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_CLIENT_ID
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_ID
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_OIDC_ISSUER
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_AUTH_METHOD
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_AUTH_METHOD
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_CORS_ORIGINS
          any: true
