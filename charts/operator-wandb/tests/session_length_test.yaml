suite: session length configuration
templates:
  - templates/api.yaml
  - templates/glue.yaml
release:
  name: wandb
  namespace: default

tests:
  - it: renders a fractional session length for the api
    template: templates/api.yaml
    set:
      global.auth.sessionLengthHours: 0.1
    asserts:
      - equal:
          path: data.GORILLA_SESSION_LENGTH
          value: 0.1h

  - it: renders a fractional session length for glue
    template: templates/glue.yaml
    set:
      global.auth.sessionLengthHours: 0.1
    asserts:
      - equal:
          path: data.GORILLA_GLUE_SESSION_LENGTH
          value: 0.1h
