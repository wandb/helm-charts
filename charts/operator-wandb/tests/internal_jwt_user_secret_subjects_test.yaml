suite: internal-JWT subjects that may resolve user secrets
templates:
  - templates/api.yaml
release:
  name: wandb
  namespace: wandb
set:
  global.weave-trace.enabled: true

tests:
  - it: grants the default weave-trace entry
    asserts:
      - equal:
          path: data.GORILLA_INTERNAL_JWT_USER_SECRET_SUBJECTS
          value: '["system:serviceaccount:wandb:wandb-weave-trace"]'

  - it: lists only entries in the JWT map that set resolveUserSecrets
    set:
      app.internalJWTMap:
        - subject: system:serviceaccount:ml:wb-weave-trace
          issuer: https://kubernetes.default.svc.cluster.local
          resolveUserSecrets: true
        - subject: system:serviceaccount:ml:other-service
          issuer: https://kubernetes.default.svc.cluster.local
        - subject: system:serviceaccount:ml:no-issuer
          resolveUserSecrets: true
        - subject: system:serviceaccount:ml:string-false
          issuer: https://kubernetes.default.svc.cluster.local
          resolveUserSecrets: "false"
    asserts:
      - equal:
          path: data.GORILLA_INTERNAL_JWT_USER_SECRET_SUBJECTS
          value: '["system:serviceaccount:ml:wb-weave-trace"]'

  - it: renders an empty list when internalJWTMap is null
    set:
      app.internalJWTMap: null
    asserts:
      - equal:
          path: data.GORILLA_INTERNAL_JWT_USER_SECRET_SUBJECTS
          value: "[]"

  - it: omits the setting when weave-trace is disabled
    set:
      global.weave-trace.enabled: false
    asserts:
      - notExists:
          path: data.GORILLA_INTERNAL_JWT_USER_SECRET_SUBJECTS
