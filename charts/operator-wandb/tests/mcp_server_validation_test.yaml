suite: MCP profile, routing, and safety validation
templates:
  - templates/mcp-validation.yaml
release:
  name: customer-a
  namespace: wandb-system

tests:
  - it: ignores MCP validation when MCP is disabled
    set:
      mcp-server.install: false
      global.api.enabled: true
      api.service.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: requires the chart-managed MCP environment helper exactly once
    set:
      mcp-server.install: true
      mcp-server.envTpls:
        - '{{ include "wandb.sslCertEnvs" . }}'
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.envTpls must include wandb.mcpEnvs exactly once

  - it: rejects duplicate canonical MCP environment helpers
    set:
      mcp-server.install: true
      mcp-server.envTpls:
        - '{{ include "wandb.mcpEnvs" . }}'
        - '{{ include "wandb.mcpEnvs" . }}'
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.envTpls must include wandb.mcpEnvs exactly once

  - it: accepts canonical MCP environment helper whitespace and trim markers
    set:
      mcp-server.install: true
      mcp-server.envTpls:
        - '{{-   include   "wandb.mcpEnvs"   .   -}}'
    asserts:
      - notFailedTemplate: {}

  - it: rejects scalar entries rendered by alternate environment templates
    set:
      mcp-server.install: true
      mcp-server.envTpls:
        - '{{ include "wandb.mcpEnvs" . }}'
        - |-
          - scalar-entry
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.envTpls entries must render a YAML array of environment maps

  - it: accepts the legacy Weave feature flag when its backend is available
    set:
      global.weave-trace.enabled: true
      mcp-server.install: true
      mcp-server.env.WANDB_MCP_ENABLE_WEAVE_TOOLS: "true"
    asserts:
      - notFailedTemplate: {}

  - it: rejects ARIA enablement in the Dedicated profile
    set:
      mcp-server.install: true
      mcp-server.env.WANDB_MCP_ENABLE_ARIA_TOOLS: "true"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WANDB_MCP_ENABLE_ARIA_TOOLS=true is unsupported in the Dedicated v0.4 profile

  - it: rejects Weave Agent enablement in the Dedicated profile
    set:
      mcp-server.install: true
      mcp-server.env.WANDB_MCP_ENABLE_WEAVE_AGENT_TOOLS: "on"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WANDB_MCP_ENABLE_WEAVE_AGENT_TOOLS=true is unsupported in the Dedicated v0.4 profile

  - it: rejects raw GraphQL enablement in the Dedicated profile
    set:
      mcp-server.install: true
      mcp-server.env.WANDB_MCP_ENABLE_RAW_GRAPHQL: "true"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WANDB_MCP_ENABLE_RAW_GRAPHQL=true is unsupported in the Dedicated v0.4 profile

  - it: consumes disabled legacy Agent ARIA and raw GraphQL flags
    set:
      mcp-server.install: true
      mcp-server.env.WANDB_MCP_ENABLE_WEAVE_AGENT_TOOLS: "OFF"
      mcp-server.env.WANDB_MCP_ENABLE_ARIA_TOOLS: 0
      mcp-server.env.WANDB_MCP_ENABLE_RAW_GRAPHQL: "no"
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown legacy boolean token
    set:
      mcp-server.install: true
      mcp-server.env.WANDB_MCP_READ_ONLY: sometimes
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WANDB_MCP_READ_ONLY must be true or false

  - it: rejects the new selector in generic env
    set:
      mcp-server.install: true
      mcp-server.env.WANDB_MCP_TOOL_PROFILE: models-weave-agents
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WANDB_MCP_TOOL_PROFILE is release-controlled; use the typed MCP values

  - it: rejects low-level workload overrides
    set:
      mcp-server.install: true
      mcp-server.env.MCP_TOOL_TIMEOUT_SECONDS: "300"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.MCP_TOOL_TIMEOUT_SECONDS is release-controlled; use the typed MCP values

  - it: rejects future admission controls by reserved prefix
    set:
      mcp-server.install: true
      mcp-server.env.MCP_ADMISSION_NEW_LIMIT: "1"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.MCP_ADMISSION_NEW_LIMIT is release-controlled; use the typed MCP values

  - it: rejects generated routing values in extraEnv
    set:
      mcp-server.install: true
      mcp-server.extraEnv.WANDB_INTERNAL_BASE_URL: http://bypass-api:8081
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.extraEnv cannot set release-controlled MCP variable WANDB_INTERNAL_BASE_URL

  - it: accepts compatibility inputs only from the root MCP environment
    set:
      mcp-server.install: true
      mcp-server.extraEnv.WANDB_MCP_READ_ONLY: "true"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.extraEnv cannot set release-controlled MCP variable WANDB_MCP_READ_ONLY

  - it: rejects generated profile values in the container environment
    set:
      mcp-server.install: true
      mcp-server.containers.mcp-server.env.WANDB_MCP_ACCESS_MODE: read-only
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.containers.mcp-server.env cannot set release-controlled MCP variable WANDB_MCP_ACCESS_MODE

  - it: rejects a workload-level W&B credential
    set:
      mcp-server.install: true
      mcp-server.env.WANDB_API_KEY: secret-canary
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WANDB_API_KEY is release-controlled; use the typed MCP values

  - it: rejects workload-level telemetry credentials
    set:
      mcp-server.install: true
      mcp-server.extraEnv.OTEL_EXPORTER_OTLP_HEADERS: Authorization=secret-canary
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.extraEnv cannot set release-controlled MCP variable OTEL_EXPORTER_OTLP_HEADERS

  - it: rejects changes to the chart-owned silent mode
    set:
      mcp-server.install: true
      mcp-server.env.WANDB_SILENT: "false"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WANDB_SILENT must remain true

  - it: rejects release controls from a secondary environment template
    set:
      mcp-server.install: true
      mcp-server.envTpls:
        - '{{ include "wandb.mcpEnvs" . }}'
        - |-
          - name: '{{ printf `WANDB_MCP_%s` `TOOL_PROFILE` }}'
            value: models-weave-agents
    asserts:
      - failedTemplate:
          errorMessage: WANDB_MCP_TOOL_PROFILE cannot be rendered by an alternate MCP environment template

  - it: rejects opaque root envFrom sources
    set:
      mcp-server.install: true
      mcp-server.envFrom.unreviewed-config: configMapRef
    asserts:
      - failedTemplate:
          errorMessage: MCP envFrom is unsupported because opaque sources can shadow the release contract

  - it: rejects opaque container envFrom sources
    set:
      mcp-server.install: true
      mcp-server.containers.mcp-server.envFrom.unreviewed-secret: secretRef
    asserts:
      - failedTemplate:
          errorMessage: MCP envFrom is unsupported because opaque sources can shadow the release contract

  - it: rejects a root image template that bypasses the immutable image tuple
    set:
      mcp-server.install: true
      mcp-server.imageTpl: 'repository: evil.example/mcp'
    asserts:
      - failedTemplate:
          errorMessage: MCP image overrides must use only mcp-server.image.repository, tag, and digest

  - it: rejects a nested container image that bypasses the immutable image tuple
    set:
      mcp-server.install: true
      mcp-server.containers.mcp-server.image.repository: evil.example/mcp
      mcp-server.containers.mcp-server.image.tag: latest
    asserts:
      - failedTemplate:
          errorMessage: MCP image overrides must use only mcp-server.image.repository, tag, and digest

  - it: rejects a nested container image template that bypasses the immutable image tuple
    set:
      mcp-server.install: true
      mcp-server.containers.mcp-server.imageTpl: 'repository: evil.example/mcp'
    asserts:
      - failedTemplate:
          errorMessage: MCP image overrides must use only mcp-server.image.repository, tag, and digest

  - it: rejects a repository that repeats the managed repository prefix
    set:
      global.repositoryPrefix: us-docker.pkg.dev/wandb-production/public
      mcp-server.install: true
      mcp-server.image.repository: us-docker.pkg.dev/wandb-production/public/wandb/mcp-server
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.image.repository must be relative when global.repositoryPrefix is configured

  - it: rejects any fully qualified repository when a managed prefix is configured
    set:
      global.repositoryPrefix: us-docker.pkg.dev/wandb-production/public
      mcp-server.install: true
      mcp-server.image.repository: evil.example/team/mcp
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.image.repository must be relative when global.repositoryPrefix is configured

  - it: rejects the removed sizing interface
    set:
      mcp-server.install: true
      mcp-server.sizing.medium.env.MCP_ADMISSION_ACTOR_CAPACITY: "64"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.sizing.medium.env is unsupported; the server-owned capacity class controls runtime policy

  - it: translates the legacy Weave feature interface
    set:
      global.weave-trace.enabled: true
      mcp-server.install: true
      mcp-server.weave.tools: "YES"
    asserts:
      - notFailedTemplate: {}

  - it: rejects conflicting legacy Weave selectors
    set:
      global.weave-trace.enabled: true
      mcp-server.install: true
      mcp-server.weave.tools: true
      mcp-server.env.WANDB_MCP_ENABLE_WEAVE_TOOLS: "false"
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.weave.tools conflicts with mcp-server.env.WANDB_MCP_ENABLE_WEAVE_TOOLS

  - it: rejects a typed profile that conflicts with a legacy selector
    set:
      global.weave-trace.enabled: true
      mcp-server.install: true
      mcp-server.tools.profile: auto
      mcp-server.weave.tools: true
    asserts:
      - failedTemplate:
          errorMessage: legacy MCP Weave selection conflicts with mcp-server.tools.profile

  - it: accepts matching typed and legacy selectors during migration
    set:
      global.weave-trace.enabled: true
      mcp-server.install: true
      mcp-server.tools.profile: models-weave
      mcp-server.weave.tools: "on"
      mcp-server.accessMode: read-only
      mcp-server.env.WANDB_MCP_READ_ONLY: "1"
    asserts:
      - notFailedTemplate: {}

  - it: rejects conflicting typed and legacy access modes
    set:
      mcp-server.install: true
      mcp-server.accessMode: read-write
      mcp-server.env.WANDB_MCP_READ_ONLY: true
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WANDB_MCP_READ_ONLY conflicts with mcp-server.accessMode

  - it: preserves the current Managed Spec Datadog compatibility input
    set:
      mcp-server.install: true
      mcp-server.datadog.enabled: true
      mcp-server.datadog.mode: agent
      mcp-server.datadog.env: production
      mcp-server.datadog.service: wandb-mcp-server-dedicated
    asserts:
      - notFailedTemplate: {}

  - it: accepts a typed Datadog provider with only a legacy service label
    set:
      mcp-server.install: true
      mcp-server.observability.provider: datadog-agent
      mcp-server.datadog.service: custom-mcp-service
    asserts:
      - notFailedTemplate: {}

  - it: rejects an explicit legacy Datadog disable with the typed provider
    set:
      mcp-server.install: true
      mcp-server.observability.provider: datadog-agent
      mcp-server.datadog.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.datadog.enabled=false conflicts with mcp-server.observability.provider=datadog-agent

  - it: rejects the retired Datadog direct forwarder
    set:
      mcp-server.install: true
      mcp-server.datadog.enabled: true
      mcp-server.datadog.mode: forwarder
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.datadog.mode must be agent; direct forwarding and pod-held credentials are unsupported

  - it: preserves the current Managed Spec privacy compatibility input
    set:
      mcp-server.install: true
      mcp-server.privacy.logLevel: standard
    asserts:
      - notFailedTemplate: {}

  - it: accepts the inert legacy OTEL and analytics defaults
    set:
      mcp-server.install: true
      mcp-server.otel.enabled: false
      mcp-server.analytics.datadogApiKeySecret.name: ""
      mcp-server.analytics.datadogApiKeySecret.key: api-key
    asserts:
      - notFailedTemplate: {}

  - it: rejects active legacy OTEL configuration
    set:
      mcp-server.install: true
      mcp-server.otel.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.otel.enabled=true is unsupported; use mcp-server.observability.provider=otel

  - it: rejects an explicit legacy OTEL disable with the typed provider
    set:
      mcp-server.install: true
      mcp-server.otel.enabled: false
      mcp-server.observability.provider: otel
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.otel.enabled=false conflicts with mcp-server.observability.provider=otel

  - it: rejects credential-bearing legacy analytics configuration
    set:
      mcp-server.install: true
      mcp-server.analytics.datadogApiKeySecret.name: legacy-datadog-key
      mcp-server.analytics.datadogApiKeySecret.key: api-key
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.analytics is retired; only an inert compatibility block is accepted

  - it: rejects changes to the chart-owned compatibility omission list
    set:
      mcp-server.install: true
      mcp-server.envOmit:
        - WANDB_MCP_ENABLE_WEAVE_TOOLS
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.envOmit is chart-owned and must contain the exact v0.3 compatibility inputs

  - it: accepts the three Dedicated tool selectors
    set:
      global.weave-trace.enabled: true
      mcp-server.install: true
      mcp-server.tools.profile: models-weave
    asserts:
      - notFailedTemplate: {}

  - it: accepts read-only access
    set:
      mcp-server.install: true
      mcp-server.accessMode: read-only
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown deployment size instead of guessing a capacity class
    set:
      global.size: enormous
      mcp-server.install: true
    asserts:
      - failedTemplate:
          errorMessage: "global.size must be one of: default, testing, small, medium, large, xlarge, xxlarge when MCP is installed"

  - it: rejects a trace URL when traces are disabled
    set:
      mcp-server.install: true
      mcp-server.traceBackend.mode: disabled
      mcp-server.traceBackend.url: https://trace.example.com/traces
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.traceBackend.url must be empty when traceBackend.mode=disabled

  - it: rejects classic Weave without a trace backend
    set:
      global.weave-trace.enabled: false
      mcp-server.install: true
      mcp-server.tools.profile: models-weave
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.tools.profile=models-weave requires global.weave-trace.enabled=true or traceBackend.url

  - it: accepts classic Weave with a validated external trace backend
    set:
      global.weave-trace.enabled: false
      mcp-server.install: true
      mcp-server.tools.profile: models-weave
      mcp-server.traceBackend.url: https://trace.example.com:443/traces/
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unsupported trace path
    set:
      mcp-server.install: true
      mcp-server.traceBackend.url: https://trace.example.com/custom
    asserts: &unsafe_trace_url
      - failedTemplate:
          errorMessage: mcp-server.traceBackend.url must be an absolute HTTP(S) origin or /traces URL without credentials, query, or fragment

  - it: rejects credentials in the trace URL
    set:
      mcp-server.install: true
      mcp-server.traceBackend.url: https://user:secret@trace.example.com
    asserts: *unsafe_trace_url

  - it: translates the legacy trace URL environment path
    set:
      mcp-server.install: true
      mcp-server.env.WF_TRACE_SERVER_URL: https://trace.example.com
    asserts:
      - notFailedTemplate: {}

  - it: accepts equal legacy trace URL aliases
    set:
      mcp-server.install: true
      mcp-server.env.WF_TRACE_SERVER_URL: https://trace.example.com/traces
      mcp-server.env.WEAVE_TRACE_SERVER_URL: https://trace.example.com/traces
    asserts:
      - notFailedTemplate: {}

  - it: rejects conflicting legacy trace URL aliases
    set:
      mcp-server.install: true
      mcp-server.env.WF_TRACE_SERVER_URL: https://trace-a.example.com
      mcp-server.env.WEAVE_TRACE_SERVER_URL: https://trace-b.example.com
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WEAVE_TRACE_SERVER_URL conflicts with mcp-server.env.WF_TRACE_SERVER_URL

  - it: rejects a legacy trace URL conflicting with the typed URL
    set:
      mcp-server.install: true
      mcp-server.traceBackend.url: https://typed.example.com
      mcp-server.env.WF_TRACE_SERVER_URL: https://legacy.example.com
    asserts:
      - failedTemplate:
          errorMessage: legacy MCP trace URL conflicts with mcp-server.traceBackend.url

  - it: rejects an empty legacy trace URL instead of guessing
    set:
      mcp-server.install: true
      mcp-server.env.WF_TRACE_SERVER_URL: ""
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.env.WF_TRACE_SERVER_URL must not be empty; omit it when no legacy trace backend is configured

  - it: validates a translated legacy trace URL
    set:
      mcp-server.install: true
      mcp-server.env.WEAVE_TRACE_SERVER_URL: ftp://trace.example.com
    asserts: *unsafe_trace_url

  - it: accepts a templated external trace URL in MCP subchart scope
    set:
      mcp-server.install: true
      mcp-server.customTraceUrl: https://trace.example.com/traces
      mcp-server.traceBackend.url: '{{ .Values.customTraceUrl }}'
    asserts:
      - notFailedTemplate: {}

  - it: rejects credentials in the internal URL
    set:
      mcp-server.install: true
      mcp-server.routing.internalBaseUrl: http://user:secret@custom-api:8081
    asserts: &unsafe_internal_url
      - failedTemplate:
          errorMessage: mcp-server.routing.internalBaseUrl must be an absolute HTTP(S) origin without credentials, path, query, or fragment

  - it: rejects a path in the internal URL
    set:
      mcp-server.install: true
      mcp-server.routing.internalBaseUrl: http://custom-api:8081/api
    asserts: *unsafe_internal_url

  - it: rejects an out-of-range internal URL port
    set:
      mcp-server.install: true
      mcp-server.routing.internalBaseUrl: http://custom-api:65536
    asserts: *unsafe_internal_url

  - it: accepts a templated HTTPS internal origin
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.enabled: false
      mcp-server.customInternalUrl: https://custom-api.platform.svc.cluster.local:8443/
      mcp-server.routing.internalBaseUrl: '{{ .Values.customInternalUrl }}'
    asserts:
      - notFailedTemplate: {}

  - it: accepts the named split API target port
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports:
        - {name: http, port: 8081, targetPort: api, protocol: TCP}
    asserts:
      - notFailedTemplate: {}

  - it: accepts the numeric split API target port
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports:
        - {name: http, port: 8081, targetPort: 8081, protocol: TCP}
    asserts:
      - notFailedTemplate: {}

  - it: accepts omitted split API target port and protocol defaults
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports:
        - {name: http, port: 8081}
    asserts:
      - notFailedTemplate: {}

  - it: accepts the named monolith app target port
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: http, protocol: TCP}
    asserts:
      - notFailedTemplate: {}

  - it: accepts the numeric monolith app target port
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: 8080, protocol: TCP}
    asserts:
      - notFailedTemplate: {}

  - it: accepts omitted monolith app target port and protocol defaults
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080}
    asserts:
      - notFailedTemplate: {}

  - it: requires an override when the split API Service is disabled
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.routing.internalBaseUrl is required when global.api.enabled=true and api.service.enabled=false

  - it: requires an override for custom split API naming
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.fullnameOverride: custom-api
    asserts: &custom_split_requires_url
      - failedTemplate:
          errorMessage: mcp-server.routing.internalBaseUrl is required when api naming or canonical HTTP routing is overridden

  - it: requires an override for a custom split API port
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports[0].port: 9081
    asserts: *custom_split_requires_url

  - it: requires an override when the split API Service targets another port
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports:
        - {name: http, port: 8081, targetPort: wrong-api, protocol: TCP}
    asserts: *custom_split_requires_url

  - it: requires an override when the split API Service does not use TCP
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports:
        - {name: http, port: 8081, targetPort: api, protocol: UDP}
    asserts: *custom_split_requires_url

  - it: rejects a quoted numeric split API target port
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports:
        - {name: http, port: 8081, targetPort: "8081", protocol: TCP}
    asserts: *custom_split_requires_url

  - it: rejects a quoted split API Service port
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports:
        - {name: http, port: "8081", targetPort: api, protocol: TCP}
    asserts: *custom_split_requires_url

  - it: requires an override when the named split API target changes port
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.containers.api.ports:
        - {name: api, containerPort: 9999, protocol: TCP}
    asserts: *custom_split_requires_url

  - it: rejects a quoted split API container port
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.containers.api.ports:
        - {name: api, containerPort: "8081", protocol: TCP}
    asserts: *custom_split_requires_url

  - it: requires an override when the named split API target does not use TCP
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.containers.api.ports:
        - {name: api, containerPort: 8081, protocol: UDP}
    asserts: *custom_split_requires_url

  - it: requires exactly one canonical named split API target
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.containers.api.ports:
        - {name: api, containerPort: 8081, protocol: TCP}
        - {name: api, containerPort: 8081, protocol: TCP}
    asserts: *custom_split_requires_url

  - it: accepts an explicit internal URL when split API Service routing is custom
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.ports:
        - {name: http, port: 8081, targetPort: wrong-api, protocol: UDP}
      mcp-server.routing.internalBaseUrl: http://custom-api.platform.svc.cluster.local:9090
    asserts:
      - notFailedTemplate: {}

  - it: requires an override when the monolith app is disabled
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.install: false
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.routing.internalBaseUrl is required when the monolith app Service is disabled

  - it: requires an override for custom monolith naming
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.name: custom-app
    asserts: &custom_monolith_requires_url
      - failedTemplate:
          errorMessage: mcp-server.routing.internalBaseUrl is required when app naming or canonical HTTP routing is overridden

  - it: requires an override for a custom monolith port
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports[0].port: 9080
    asserts: *custom_monolith_requires_url

  - it: requires an override when the monolith app Service targets another port
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: wrong-app, protocol: TCP}
    asserts: *custom_monolith_requires_url

  - it: requires an override when the monolith app Service does not use TCP
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, protocol: UDP}
    asserts: *custom_monolith_requires_url

  - it: rejects a quoted numeric monolith app target port
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: "8080", protocol: TCP}
    asserts: *custom_monolith_requires_url

  - it: rejects a quoted monolith app Service port
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: "8080", targetPort: http, protocol: TCP}
    asserts: *custom_monolith_requires_url

  - it: requires an override when the named monolith app target changes port
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: http, protocol: TCP}
      app.containers.app.ports:
        - {name: http, containerPort: 9999, protocol: TCP}
    asserts: *custom_monolith_requires_url

  - it: rejects a quoted monolith app container port
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: http, protocol: TCP}
      app.containers.app.ports:
        - {name: http, containerPort: "8080", protocol: TCP}
    asserts: *custom_monolith_requires_url

  - it: requires an override when the named monolith app target does not use TCP
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: http, protocol: TCP}
      app.containers.app.ports:
        - {name: http, containerPort: 8080, protocol: UDP}
    asserts: *custom_monolith_requires_url

  - it: requires exactly one canonical named monolith app target
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: http, protocol: TCP}
      app.containers.app.ports:
        - {name: http, containerPort: 8080, protocol: TCP}
        - {name: http, containerPort: 8080, protocol: TCP}
    asserts: *custom_monolith_requires_url

  - it: accepts an explicit internal URL when monolith app Service routing is custom
    set:
      mcp-server.install: true
      global.api.enabled: false
      app.service.ports:
        - {name: app, port: 8080, targetPort: wrong-app, protocol: UDP}
      mcp-server.routing.internalBaseUrl: http://custom-app.platform.svc.cluster.local:9090
    asserts:
      - notFailedTemplate: {}

  - it: accepts a custom topology with an explicit typed internal URL
    set:
      mcp-server.install: true
      global.api.enabled: true
      api.service.enabled: false
      api.fullnameOverride: custom-api
      mcp-server.routing.internalBaseUrl: http://custom-api.platform.svc.cluster.local:9090
    asserts:
      - notFailedTemplate: {}

  - it: rejects OTEL when neither an explicit collector nor the daemonset exists
    set:
      mcp-server.install: true
      mcp-server.observability.provider: otel
      otel.install: false
      otel.daemonset.install: false
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.observability.provider=otel requires the OTEL daemonset or global.otel.traces.host

  - it: accepts a validated external OTEL collector
    set:
      mcp-server.install: true
      mcp-server.observability.provider: otel
      otel.install: false
      global.otel.traces.host: otel.example.internal
      global.otel.traces.port: 4318
      global.otel.traces.proto: http
    asserts:
      - notFailedTemplate: {}

  - it: rejects an explicit zero OTEL port instead of treating it as omitted
    set:
      mcp-server.install: true
      mcp-server.observability.provider: otel
      mcp-server.routing.internalBaseUrl: http://custom-app.platform.svc.cluster.local:8080
      global.otel.traces.port: 0
    asserts:
      - failedTemplate:
          errorMessage: global.otel.traces.port must be between 1 and 65535

  - it: preserves MCP isolation from global administrative environment
    set:
      mcp-server.install: true
      mcp-server.globalOptOut.env: false
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.globalOptOut.env must remain true to isolate MCP from global administrative environment

  - it: rejects use of the default Kubernetes service account
    set:
      mcp-server.install: true
      mcp-server.serviceAccount.create: false
    asserts:
      - failedTemplate:
          errorMessage: mcp-server must use its dedicated service account with token automount disabled

  - it: rejects Kubernetes token automount
    set:
      mcp-server.install: true
      mcp-server.serviceAccount.automount: true
    asserts:
      - failedTemplate:
          errorMessage: mcp-server must use its dedicated service account with token automount disabled

  - it: rejects Kubernetes RBAC creation
    set:
      mcp-server.install: true
      mcp-server.role.create: true
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.role.create must remain false because MCP needs no Kubernetes RBAC

  - it: rejects multiple MCP replicas
    set:
      mcp-server.install: true
      mcp-server.replicaCount: 2
    asserts:
      - failedTemplate: {}

  - it: rejects HPA enablement
    set:
      mcp-server.install: true
      mcp-server.autoscaling.horizontal.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: mcp-server HPA, VPA, and KEDA must remain disabled in the Dedicated v0.4 contract

  - it: rejects VPA enablement
    set:
      mcp-server.install: true
      mcp-server.autoscaling.vertical.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: mcp-server HPA, VPA, and KEDA must remain disabled in the Dedicated v0.4 contract

  - it: rejects KEDA enablement
    set:
      mcp-server.install: true
      mcp-server.autoscaling.keda.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: mcp-server HPA, VPA, and KEDA must remain disabled in the Dedicated v0.4 contract

  - it: rejects an externally exposed MCP Service
    set:
      mcp-server.install: true
      mcp-server.service.type: LoadBalancer
    asserts:
      - failedTemplate:
          errorMessage: mcp-server.service must remain an enabled internal ClusterIP

  - it: rejects a quoted MCP Service port
    set:
      mcp-server.install: true
      mcp-server.service.ports:
        - {name: http, port: "8080", targetPort: 8080, protocol: TCP}
    asserts: &invalid_mcp_service_port
      - failedTemplate:
          errorMessage: MCP http Service port must be an integer from 1 to 65535 using TCP and targetPort 8080

  - it: rejects a quoted MCP Service target port
    set:
      mcp-server.install: true
      mcp-server.service.ports:
        - {name: http, port: 8080, targetPort: "8080", protocol: TCP}
    asserts: *invalid_mcp_service_port

  - it: rejects a non-string MCP Service protocol
    set:
      mcp-server.install: true
      mcp-server.service.ports:
        - {name: http, port: 8080, targetPort: 8080, protocol: false}
    asserts: *invalid_mcp_service_port

  - it: permits non-contract local environment values
    set:
      mcp-server.install: true
      mcp-server.env.CUSTOM_CA_BUNDLE: /etc/ssl/customer.pem
    asserts:
      - notFailedTemplate: {}
