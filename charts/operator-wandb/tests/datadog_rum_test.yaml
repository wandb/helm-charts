suite: Datadog RUM frontend configuration
templates:
  - templates/frontend.yaml
release:
  name: wandb
  namespace: default

tests:
  - it: leaves Dedicated RUM disabled by default
    template: templates/frontend.yaml
    documentIndex: 0
    asserts:
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_ENABLED
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_PROFILING_SAMPLE_RATE
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_SESSION_SAMPLE_RATE
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_SESSION_REPLAY_SAMPLE_RATE
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_TRACE_SAMPLE_RATE

  - it: renders the Dedicated RUM runtime settings
    template: templates/frontend.yaml
    documentIndex: 0
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.profilingSampleRate: 10
      global.datadog.rum.sessionSampleRate: 90
      global.datadog.rum.sessionReplaySampleRate: 25
      global.datadog.rum.traceSampleRate: 75
    asserts:
      - equal:
          path: data.REACT_APP_DATADOG_RUM_ENABLED
          value: "true"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_PROFILING_SAMPLE_RATE
          value: "10"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_SAMPLE_RATE
          value: "90"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_REPLAY_SAMPLE_RATE
          value: "25"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_TRACE_SAMPLE_RATE
          value: "75"
      - notExists:
          path: data.REACT_APP_CUSTOMER_NS

  - it: requires the canonical customer namespace when Dedicated RUM is enabled
    template: templates/frontend.yaml
    set:
      global.datadog.rum.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: global.extraEnv.TAG_CUSTOMER_NS must be a lowercase customer namespace when Dedicated RUM is enabled

  - it: rejects a non-boolean enable value
    template: templates/frontend.yaml
    set:
      global.datadog.rum.enabled: enabled
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.enabled must be a boolean

  - it: rejects a malformed customer namespace
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: WandB_Customer
      global.datadog.rum.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: global.extraEnv.TAG_CUSTOMER_NS must be a lowercase customer namespace when Dedicated RUM is enabled

  - it: omits all RUM settings when explicitly disabled with retained configuration
    template: templates/frontend.yaml
    documentIndex: 0
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: false
      global.datadog.rum.profilingSampleRate: 10
      global.datadog.rum.sessionSampleRate: 90
      global.datadog.rum.sessionReplaySampleRate: 25
      global.datadog.rum.traceSampleRate: 75
    asserts:
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_ENABLED
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_PROFILING_SAMPLE_RATE
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_SESSION_SAMPLE_RATE
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_SESSION_REPLAY_SAMPLE_RATE
      - notExists:
          path: data.REACT_APP_DATADOG_RUM_TRACE_SAMPLE_RATE

  - it: renders enabled defaults
    template: templates/frontend.yaml
    documentIndex: 0
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
    asserts:
      - equal:
          path: data.REACT_APP_DATADOG_RUM_ENABLED
          value: "true"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_PROFILING_SAMPLE_RATE
          value: "0"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_SAMPLE_RATE
          value: "100"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_REPLAY_SAMPLE_RATE
          value: "25"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_TRACE_SAMPLE_RATE
          value: "100"

  - it: preserves explicit zero for every rate
    template: templates/frontend.yaml
    documentIndex: 0
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.profilingSampleRate: 0
      global.datadog.rum.sessionSampleRate: 0
      global.datadog.rum.sessionReplaySampleRate: 0
      global.datadog.rum.traceSampleRate: 0
    asserts:
      - equal:
          path: data.REACT_APP_DATADOG_RUM_ENABLED
          value: "true"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_PROFILING_SAMPLE_RATE
          value: "0"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_SAMPLE_RATE
          value: "0"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_REPLAY_SAMPLE_RATE
          value: "0"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_TRACE_SAMPLE_RATE
          value: "0"

  - it: accepts the upper boundary for every rate
    template: templates/frontend.yaml
    documentIndex: 0
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.profilingSampleRate: 100
      global.datadog.rum.sessionSampleRate: 100
      global.datadog.rum.sessionReplaySampleRate: 100
      global.datadog.rum.traceSampleRate: 100
    asserts:
      - equal:
          path: data.REACT_APP_DATADOG_RUM_ENABLED
          value: "true"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_PROFILING_SAMPLE_RATE
          value: "100"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_SAMPLE_RATE
          value: "100"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_REPLAY_SAMPLE_RATE
          value: "100"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_TRACE_SAMPLE_RATE
          value: "100"

  - it: preserves fractional sample rates
    template: templates/frontend.yaml
    documentIndex: 0
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.profilingSampleRate: 0.5
      global.datadog.rum.sessionSampleRate: 25.5
      global.datadog.rum.sessionReplaySampleRate: 50.5
      global.datadog.rum.traceSampleRate: 99.5
    asserts:
      - equal:
          path: data.REACT_APP_DATADOG_RUM_ENABLED
          value: "true"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_PROFILING_SAMPLE_RATE
          value: "0.5"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_SAMPLE_RATE
          value: "25.5"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_SESSION_REPLAY_SAMPLE_RATE
          value: "50.5"
      - equal:
          path: data.REACT_APP_DATADOG_RUM_TRACE_SAMPLE_RATE
          value: "99.5"

  - it: rejects a negative profilingSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.profilingSampleRate: -1
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.profilingSampleRate must be a number between 0 and 100

  - it: rejects an above-100 profilingSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.profilingSampleRate: 101
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.profilingSampleRate must be a number between 0 and 100

  - it: rejects a non-numeric profilingSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.profilingSampleRate: invalid
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.profilingSampleRate must be a number between 0 and 100

  - it: rejects a negative sessionSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.sessionSampleRate: -1
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.sessionSampleRate must be a number between 0 and 100

  - it: rejects an above-100 sessionSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.sessionSampleRate: 101
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.sessionSampleRate must be a number between 0 and 100

  - it: rejects a non-numeric sessionSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.sessionSampleRate: invalid
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.sessionSampleRate must be a number between 0 and 100

  - it: rejects a negative sessionReplaySampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.sessionReplaySampleRate: -1
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.sessionReplaySampleRate must be a number between 0 and 100

  - it: rejects an above-100 sessionReplaySampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.sessionReplaySampleRate: 101
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.sessionReplaySampleRate must be a number between 0 and 100

  - it: rejects a non-numeric sessionReplaySampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.sessionReplaySampleRate: invalid
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.sessionReplaySampleRate must be a number between 0 and 100

  - it: rejects a negative traceSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.traceSampleRate: -1
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.traceSampleRate must be a number between 0 and 100

  - it: rejects an above-100 traceSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.traceSampleRate: 101
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.traceSampleRate must be a number between 0 and 100

  - it: rejects a non-numeric traceSampleRate
    template: templates/frontend.yaml
    set:
      global.extraEnv.TAG_CUSTOMER_NS: wandb-s-perf-int
      global.datadog.rum.enabled: true
      global.datadog.rum.traceSampleRate: invalid
    asserts:
      - failedTemplate:
          errorMessage: global.datadog.rum.traceSampleRate must be a number between 0 and 100
