suite: history store validation
templates:
  - templates/history-validation.yaml
release:
  name: wandb
  namespace: default

tests:
  - it: accepts the default liveStore
    asserts:
      - notFailedTemplate: {}

  - it: accepts liveStore clickhouse with history OLAP enabled
    set:
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: rejects liveStore clickhouse without history OLAP
    set:
      global:
        historyStore:
          liveStore: clickhouse
    asserts:
      - failedTemplate:
          errorMessage: global.historyStore.liveStore "clickhouse" requires global.olap.history.enabled

  - it: rejects an unknown liveStore
    set:
      global:
        historyStore:
          liveStore: bigquery
    asserts:
      - failedTemplate:
          errorMessage: global.historyStore.liveStore must be "auto" or "clickhouse", got "bigquery"

  - it: accepts liveStore clickhouse when history OLAP inherits default.enabled and history-updater is installed
    set:
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          default:
            enabled: true
      history-updater:
        install: true
    asserts:
      - notFailedTemplate: {}

  - it: rejects liveStore clickhouse when only default.enabled leaves history-updater uninstalled
    set:
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          default:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: global.historyStore.liveStore "clickhouse" requires history-updater, which global.olap.default.enabled does not install; set global.olap.history.enabled or history-updater.install

  - it: rejects liveStore clickhouse when history-updater.install loses to history OLAP
    set:
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          default:
            enabled: true
          history:
            enabled: false
      history-updater:
        install: true
    asserts:
      - failedTemplate:
          errorMessage: global.historyStore.liveStore "clickhouse" requires global.olap.history.enabled

  - it: rejects liveStore clickhouse when history OLAP overrides default.enabled
    set:
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          default:
            enabled: true
          history:
            enabled: false
    asserts:
      - failedTemplate:
          errorMessage: global.historyStore.liveStore "clickhouse" requires global.olap.history.enabled

  - it: rejects a global.env HISTORY_* override with liveStore clickhouse
    set:
      global:
        env:
          HISTORY_PASSWORD: override
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: global.env.HISTORY_PASSWORD must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a global.extraEnv live store override with liveStore clickhouse
    set:
      global:
        extraEnv:
          GORILLA_PARQUET_LIVE_HISTORY_STORE: override
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: global.extraEnv.GORILLA_PARQUET_LIVE_HISTORY_STORE must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a reader extraEnv HISTORY_* override with liveStore clickhouse
    set:
      api:
        extraEnv:
          HISTORY_PASSWORD: override
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: api.extraEnv.HISTORY_PASSWORD must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a reader env HISTORY_* override with liveStore clickhouse
    set:
      app:
        env:
          HISTORY_HOST: override
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: app.env.HISTORY_HOST must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a reader container env live store override with liveStore clickhouse
    set:
      executor:
        containers:
          executor:
            env:
              GORILLA_PARQUET_LIVE_HISTORY_STORE: override
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: executor.containers.executor.env.GORILLA_PARQUET_LIVE_HISTORY_STORE must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a reader init container env HISTORY_* override with liveStore clickhouse
    set:
      glue:
        initContainers:
          migrate-db:
            env:
              HISTORY_USER: override
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: glue.initContainers.migrate-db.env.HISTORY_USER must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: allows a HISTORY_* override in an inactive reader sizing preset
    set:
      parquet:
        sizing:
          large:
            env:
              HISTORY_PORT: override
      global:
        size: small
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: rejects a HISTORY_* override in the preset selected by a reader size
    set:
      parquet:
        size: large
        sizing:
          large:
            env:
              HISTORY_PORT: override
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: parquet.sizing.large.env.HISTORY_PORT must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a HISTORY_* override in the default sizing preset
    set:
      parquet:
        sizing:
          default:
            env:
              HISTORY_PORT: override
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: parquet.sizing.default.env.HISTORY_PORT must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a reader sizing env HISTORY_* override with liveStore clickhouse
    set:
      parquet:
        sizing:
          large:
            env:
              HISTORY_PORT: override
      global:
        size: large
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: parquet.sizing.large.env.HISTORY_PORT must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a HISTORY_* override in a reader cron job container
    set:
      parquet:
        cronJobs:
          parquet-backfill:
            containers:
              backfill-job:
                env:
                  HISTORY_PASSWORD: override
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: parquet.cronJobs.parquet-backfill.containers.backfill-job.env.HISTORY_PASSWORD must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: rejects a live store override in a reader job init container
    set:
      glue:
        jobs:
          reindex:
            initContainers:
              wait:
                env:
                  GORILLA_PARQUET_LIVE_HISTORY_STORE: override
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - failedTemplate:
          errorMessage: glue.jobs.reindex.initContainers.wait.env.GORILLA_PARQUET_LIVE_HISTORY_STORE must not be set when global.historyStore.liveStore is "clickhouse"; configure the connection under global.olap.history

  - it: allows a HISTORY_* override in a reader cron job container with the auto liveStore
    set:
      parquet:
        cronJobs:
          parquet-backfill:
            containers:
              backfill-job:
                env:
                  HISTORY_PASSWORD: override
    asserts:
      - notFailedTemplate: {}

  - it: allows HISTORY_* overrides on workers that do not read the live store
    set:
      filestream:
        extraEnv:
          HISTORY_PASSWORD: unrelated
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: allows HISTORY_* overrides in jobs of workers that do not read the live store
    set:
      settingsMigrationJob:
        jobs:
          smj:
            containers:
              smj:
                env:
                  HISTORY_PASSWORD: unrelated
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          history:
            enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: allows global.env HISTORY_* names with the auto liveStore
    set:
      global:
        env:
          HISTORY_PASSWORD: unrelated
    asserts:
      - notFailedTemplate: {}
