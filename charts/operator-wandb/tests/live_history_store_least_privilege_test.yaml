suite: live history store least privilege
templates:
  - charts/filestream/templates/deployment.yaml
  - charts/flat-run-fields-updater/templates/deployment.yaml
  - charts/metric-observer/templates/deployment.yaml
  - charts/parquet-metadata-cache/templates/deployment.yaml
release:
  name: wandb
  namespace: default

# These workers never read GORILLA_PARQUET_LIVE_HISTORY_STORE, so selecting the
# ClickHouse live store must not hand them history credentials. They default to
# install: false, so the test installs them to render their deployments.
tests:
  - it: keeps history credentials off workers that do not read the live history store
    set:
      filestream.install: true
      flat-run-fields-updater.install: true
      metric-observer.install: true
      parquet-metadata-cache.install: true
      global:
        historyStore:
          liveStore: clickhouse
        olap:
          default:
            host: history-clickhouse.example.com
            password: history-password
          history:
            enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: HISTORY_PASSWORD
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_HISTORY_STORAGE_ENGINE_ADDRESS
          any: true
