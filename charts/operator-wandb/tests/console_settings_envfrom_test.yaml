              optional: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[-2]
          value:
            secretRef:
              name: chartsnap-bucket
  - it: loads the Console settings Secret last in filestream
    template: charts/filestream/templates/deployment.yaml
    set:
      filestream.install: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[-1]
          value:
            secretRef:
              name: chartsnap-console-settings
              optional: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[-2]
          value:
            secretRef:
              name: chartsnap-bucket
  - it: loads the Console settings Secret last in the flat run fields updater
    template: charts/flat-run-fields-updater/templates/deployment.yaml
    set:
