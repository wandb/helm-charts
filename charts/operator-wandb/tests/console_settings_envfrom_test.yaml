suite: Console settings envFrom
templates:
  - charts/api/templates/deployment.yaml
  - charts/app/templates/deployment.yaml
  - charts/executor/templates/deployment.yaml
  - charts/filemeta/templates/deployment.yaml
  - charts/filestream/templates/deployment.yaml
  - charts/flat-run-fields-updater/templates/deployment.yaml
  - charts/history-updater/templates/deployment.yaml
  - charts/run-store-accelerator-run-updater/templates/deployment.yaml
  - charts/glue/templates/deployment.yaml
  - charts/metric-observer/templates/deployment.yaml
  - charts/parquet/templates/deployment.yaml
  - charts/parquet-metadata-cache/templates/deployment.yaml
  - charts/lumen-agent/templates/cronjob.yaml
release:
  name: chartsnap
tests:
  - it: loads the Console settings Secret last in the API
    template: charts/api/templates/deployment.yaml
    set:
      global.api.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[-1]
          value:
            secretRef:
              name: chartsnap-console-settings
              optional: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[-2]
          value:
            secretRef:
              name: chartsnap-bucket
  - it: loads the Console settings Secret last in the app
    template: charts/app/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[-1]
          value:
            secretRef:
              name: chartsnap-console-settings
              optional: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[-2]
          value:
            secretRef:
              name: chartsnap-bucket
  - it: loads the Console settings Secret last in the executor
    template: charts/executor/templates/deployment.yaml
    set:
      executor.install: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[-1]
          value:
            secretRef:
              name: chartsnap-console-settings
              optional: true
      - equal:
          path: spec.template.spec.containers[0].envFrom[-2]
          value:
            secretRef:
              name: chartsnap-bucket
  - it: loads the Console settings Secret last in filemeta
    template: charts/filemeta/templates/deployment.yaml
    set:
      filemeta.install: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[-1]
          value:
            secretRef:
