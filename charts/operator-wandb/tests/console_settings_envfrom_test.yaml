  - it: loads the Console settings Secret last in the lumen agent
    template: charts/lumen-agent/templates/cronjob.yaml
    set:
      lumen-agent.install: true
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom[-1]
          value:
            secretRef:
              name: chartsnap-console-settings
              optional: true
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom[-2]
          value:
            secretRef:
              name: chartsnap-bucket
  - it: keeps the Console settings Secret when an external bucket Secret is set
    template: charts/glue/templates/deployment.yaml
    set:
      global.glue.enabled: true
      global.bucket:
        provider: az
        name: storage
        secret:
          secretName: customer-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[-1]
          value:
            secretRef:
              name: chartsnap-console-settings
              optional: true
      - notContains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: chartsnap-bucket
