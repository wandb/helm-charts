suite: app rename post-upgrade hook role
templates:
  - charts/appRenamePostHook/templates/role.yaml
release:
  name: wandb
  namespace: default

tests:
  - it: grants ReplicaSet diagnostics only list access
    asserts:
      - equal:
          path: rules[0].resources
          value:
            - deployments
      - equal:
          path: rules[0].verbs
          value:
            - get
            - delete
            - list
            - watch
      - equal:
          path: rules[1].resources
          value:
            - replicasets
      - equal:
          path: rules[1].verbs
          value:
            - list
