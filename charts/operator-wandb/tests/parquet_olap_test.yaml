suite: parquet OLAP history params
templates:
  - charts/parquet/templates/deployment.yaml
release:
  name: wandb
  namespace: default

tests:
  - it: layers the parquet pool defaults over the global history params
    template: charts/parquet/templates/deployment.yaml
    set:
      global:
        olap:
          default:
            host: history-clickhouse.example.com
            password: history-password
            params:
              tls: "false"
          history:
            enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HISTORY_PARAMS
            value: "?conn_max_lifetime=1h&max_open_conns=500&tls=false"

  - it: lets parquet.olap.history.params override global history params
    template: charts/parquet/templates/deployment.yaml
    set:
      parquet.olap.history.params.max_open_conns: 800
      parquet.olap.history.params.conn_max_lifetime: 30m
      global:
        olap:
          default:
            host: history-clickhouse.example.com
            password: history-password
          history:
            enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HISTORY_PARAMS
            value: "?conn_max_lifetime=30m&max_open_conns=800"
