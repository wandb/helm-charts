suite: history updater OLAP enablement
templates:
  - charts/history-updater/templates/deployment.yaml
  - charts/clickhouseMigrationJob/templates/job.yaml
release:
  name: wandb
  namespace: default

# helm-unittest cannot assert on templates of a subchart that Helm disabled via
# its dependency condition, so the negative cases (defaults, and an explicit
# global.olap.history.enabled=false overriding history-updater.install=true)
# are covered by the chart snapshots rather than this suite.
tests:
  - it: deploys the history updater with full tracing when history OLAP is enabled
    template: charts/history-updater/templates/deployment.yaml
    set:
      global:
        olap:
          default:
            host: history-clickhouse.example.com
            password: history-password
          history:
            enabled: true
      history-updater.install: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: wandb-history-updater
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_TRACER
            value: otlp+grpc://wandb-otel-daemonset:4317?trace_ratio=1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GORILLA_HISTORY_STORAGE_ENGINE_ADDRESS
            value: clickhouse://$(HISTORY_USER):$(HISTORY_PASSWORD)@$(HISTORY_HOST):$(HISTORY_PORT)/$(HISTORY_DATABASE)$(HISTORY_PARAMS)

  - it: preserves the legacy history updater install flag
    template: charts/history-updater/templates/deployment.yaml
    set:
      history-updater.install: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: wandb-history-updater

  - it: runs the history OLAP migration from the same flag
    template: charts/clickhouseMigrationJob/templates/job.yaml
    set:
      global:
        olap:
          default:
            host: history-clickhouse.example.com
            password: history-password
          history:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MIGRATE_HISTORY_DB
            value: clickhouse://$(HISTORY_USER):$(HISTORY_PASSWORD)@$(HISTORY_HOST):$(HISTORY_PORT)/$(HISTORY_DATABASE)$(HISTORY_PARAMS)
