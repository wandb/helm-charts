suite: Weave Trace service account
templates:
  - charts/weave-trace/templates/deployment.yaml
  - charts/weave-trace/templates/serviceaccount.yaml
  - charts/weave-trace-worker/templates/deployment.yaml
  - charts/weave-trace-worker/templates/serviceaccount.yaml
  - charts/weave-evaluate-model-worker/templates/deployment.yaml
  - charts/weave-evaluate-model-worker/templates/serviceaccount.yaml
  - charts/weave-trace-agent-scoring-worker/templates/deployment.yaml
  - charts/weave-trace-agent-scoring-worker/templates/serviceaccount.yaml
release:
  name: custom-release

tests:
  - it: derives the trace ServiceAccount from the release name
    template: charts/weave-trace/templates/deployment.yaml
    set:
      weave-trace:
        install: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-release-weave-trace

  - it: creates the release-derived trace ServiceAccount
    template: charts/weave-trace/templates/serviceaccount.yaml
    set:
      weave-trace:
        install: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: custom-release-weave-trace

  - it: gives the trace worker the release-derived trace ServiceAccount
    template: charts/weave-trace-worker/templates/deployment.yaml
    set:
      weave-trace-worker:
        install: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-release-weave-trace

  - it: does not create a trace worker ServiceAccount
    template: charts/weave-trace-worker/templates/serviceaccount.yaml
    set:
      weave-trace-worker:
        install: true
    asserts:
      - hasDocuments:
          count: 0

  - it: gives the evaluate-model worker the release-derived trace ServiceAccount
    template: charts/weave-evaluate-model-worker/templates/deployment.yaml
    set:
      weave-evaluate-model-worker:
        install: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-release-weave-trace

  - it: does not create an evaluate-model worker ServiceAccount
    template: charts/weave-evaluate-model-worker/templates/serviceaccount.yaml
    set:
      weave-evaluate-model-worker:
        install: true
    asserts:
      - hasDocuments:
          count: 0

  - it: gives the agent-scoring worker the release-derived trace ServiceAccount
    template: charts/weave-trace-agent-scoring-worker/templates/deployment.yaml
    set:
      weave-trace-agent-scoring-worker:
        install: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-release-weave-trace

  - it: does not create an agent-scoring worker ServiceAccount
    template: charts/weave-trace-agent-scoring-worker/templates/serviceaccount.yaml
    set:
      weave-trace-agent-scoring-worker:
        install: true
    asserts:
      - hasDocuments:
          count: 0
