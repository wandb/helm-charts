---
suite: ip_allowlist
templates:
- templates/ip-allowlist.yaml
tests:
- it: preserves defaults without a Traefik custom resource
  set: {}
  asserts:
  - hasDocuments:
      count: 0
- it: stages a valid policy without middleware
  set:
    global.ipAllowList.enabled: true
    global.ipAllowList.systemCIDRs:
    - 10.0.0.0/8
  asserts:
  - hasDocuments:
      count: 0
- it: rejects invalid policy state 2
  set:
    global.ipAllowList.enabled: true
  asserts:
  - failedTemplate:
      errorMessage: global.ipAllowList.enabled=true requires at least one CIDR in
        systemCIDRs or userCIDRs; add an explicit allowed range
- it: rejects invalid policy state 3
  set:
    global.traefikIngress: true
  asserts:
  - failedTemplate:
      errorMessage: global.traefikIngress=true requires global.ipAllowList.enabled=true
        and at least one allowed CIDR
- it: warns without middleware when disabled with systemCIDRs
  set:
    global.ipAllowList.systemCIDRs:
    - 10.0.0.0/8
  asserts:
  - hasDocuments:
      count: 0
- it: warns without middleware when disabled with userCIDRs
  set:
    global.ipAllowList.userCIDRs:
    - 10.0.0.0/8
  asserts:
  - hasDocuments:
      count: 0
- it: accepts systemCIDRs 0.0.0.0/0
  set:
    global.ipAllowList.enabled: true
    global.ipAllowList.systemCIDRs:
    - 0.0.0.0/0
    global.traefikIngress: true
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: spec.ipAllowList.sourceRange
      value:
      - 0.0.0.0/0
- it: accepts systemCIDRs 255.255.255.255/32
  set:
    global.ipAllowList.enabled: true
    global.ipAllowList.systemCIDRs:
