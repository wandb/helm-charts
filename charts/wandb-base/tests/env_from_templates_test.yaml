suite: Conditional environment sources
templates:
  - deployment.yaml
set:
  containers:
    app: {}
  envFrom:
    static-config: configMapRef
tests:
  - it: renders shared and container sources with release context
    set:
      envFromTpls:
        - '- secretRef: {name: "{{ .Release.Name }}-shared"}'
      containers.app.envFromTpls:
        - '- configMapRef: {name: "{{ .Release.Name }}-local"}'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef: {name: static-config}
            - secretRef: {name: RELEASE-NAME-shared}
            - configMapRef: {name: RELEASE-NAME-local}
  - it: omits conditional sources that render empty
    set:
      envFromTpls:
        - '{{ if false }}- secretRef: {name: absent}{{ end }}'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef: {name: static-config}
  - it: preserves existing sources without templates
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef: {name: static-config}
  - it: adds global envFrom sources
    set:
      global.envFrom:
        shared-env: secretRef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef: {name: shared-env}
            - configMapRef: {name: static-config}
  - it: renders global envFromOverrides after all other sources so they take precedence
    set:
      global.envFrom:
        aaa-shared-env: secretRef
      global.envFromOverrides:
        aaa-override-env: secretRef
      envFromTpls:
        - '- configMapRef: {name: templated-config}'
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - secretRef: {name: aaa-shared-env}
            - configMapRef: {name: static-config}
            - configMapRef: {name: templated-config}
            - secretRef: {name: aaa-override-env}
  - it: renders an override source also listed as envFrom once, in the envFrom position
    set:
      global.envFromOverrides:
        static-config: configMapRef
        override-env: secretRef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef: {name: static-config}
            - secretRef: {name: override-env}
  - it: skips global envFrom sources with the global env opt-out
    set:
      global.envFrom:
        shared-env: secretRef
      global.envFromOverrides:
        override-env: secretRef
      globalOptOut.env: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef: {name: static-config}
