suite: Inherited environment templates
templates:
  - deployment.yaml
set:
  containers.app: {}
  initContainers.prepare: {}
  global.envTpls:
    - |
      - name: SHARED_SETTING
        value: "{{ .container.name }}"
tests:
  - it: renders inherited templates for main and init containers
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: SHARED_SETTING, value: app}
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: {name: SHARED_SETTING, value: prepare}

  - it: lets service templates override inherited ones without duplicate names
    set:
      envTpls:
        - |
          - name: SHARED_SETTING
            value: service
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: SHARED_SETTING, value: service}]

  - it: lets container templates override service and inherited templates
    set:
      envTpls:
        - |
          - name: SHARED_SETTING
            value: service
      containers.app.envTpls:
        - |
          - name: SHARED_SETTING
            value: container
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: SHARED_SETTING, value: container}]

  - it: lets explicit values override all templates
    set:
      env.SHARED_SETTING: explicit
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: SHARED_SETTING, value: explicit}]

  - it: respects the global env opt-out without dropping service templates
    set:
      globalOptOut.env: "true"
      envTpls:
        - |
          - name: LOCAL_SETTING
            value: local
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value: [{name: LOCAL_SETTING, value: local}]
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content: {name: SHARED_SETTING}
          any: true
