{{- if .Values.test.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "wandb-base.fullname" . }}-test-connection"
  labels:
    {{- include "wandb-base.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  {{- $profile := include "wandb-base.securityProfile" (dict "root" . "podData" .Values.test "container" dict) | fromYaml }}
  {{- if $profile.enabled }}
  automountServiceAccountToken: {{ $profile.automountServiceAccountToken }}
  securityContext:
    {{- include "wandb-base.podSecurityProfile" (dict "context" dict "profile" $profile) | nindent 4 }}
  {{- end }}
  containers:
    - name: wget
  {{- if $profile.enabled }}
      securityContext:
        {{- include "wandb-base.containerSecurityProfile" (dict "context" dict "profile" $profile) | nindent 8 }}
  {{- end }}
      image: busybox
      command: ['wget']
      args: ['{{ include "wandb-base.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
{{- end }}
